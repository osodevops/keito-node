          description: Duplicated estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── INVOICE MESSAGES ──────────────────────────────────────────
  /api/v2/invoices/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }

    get:
      tags: [Invoice Messages]
      summary: List invoice messages
      operationId: listInvoiceMessages
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: Paginated list of invoice messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      invoice_messages:
                        type: array
                        items:
                          $ref: "#/components/schemas/InvoiceMessage"

    post:
      tags: [Invoice Messages]
      summary: Send an invoice
      operationId: sendInvoice
      description: >-
        Sends the invoice via email and transitions state to OPEN. Use
        `event_type: "mark_sent"` to transition a draft to OPEN without sending
        email or requiring recipients. Use
        `event_type: "resend"` to email another copy of a previously sent open
        or paid invoice: the invoice keeps its state, number, dates, and first-sent
        timestamp, a `resend` message is recorded, accounting integrations are
        not re-posted, and a second resend within one minute is refused.

        Optional `confirm` binds the request to the invoice as the caller last
        saw it: `amount` (compared at two decimals) and `currency` (case
        insensitive) must equal the invoice's current values, and
        `recipient_count`, when given, must equal the number of distinct To
        recipients (0 for `mark_sent`). Any mismatch returns 409 with
        `error: confirmation_mismatch`, `expected` and `received`, and nothing
        changes. Requests without `confirm` behave as before.

        An `Idempotency-Key` makes retries safe for 24 hours. Every validation
        above runs before the key is claimed, so a refused request never
        consumes it; a completed send, including a post-issue delivery failure,
        is replayed rather than re-issued. Manager access is required. AI app
        connections additionally need `canManageInvoices` for every
        `event_type` (`can_send_invoices`).
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceMessageCreate"
      responses:
        "200":
          description: Created invoice message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceMessage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrCapabilityRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvoiceConfirmationOrIdempotencyConflict" }

  /api/v2/invoices/{id}/payments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }

    get:
      tags: [Invoices]
      summary: List an invoice's payments
      operationId: listInvoicePayments
      description: >-
        Payments recorded against the invoice, newest first (by payment date,
        then by when they were recorded). Requires the `can_view_invoices`
        capability, as for `GET /api/v2/invoices`. Each row carries
        `deletable`: true only for a manually recorded payment when the caller
        may manage invoices, which is exactly what
        `DELETE /api/v2/invoices/{id}/payments/{paymentId}` will accept.
        Servers that offer this list advertise `invoice-payments-list` in
        `X-Keito-Features`.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: Paginated list of the invoice's payments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      payments:
                        type: array
                        items:
                          $ref: "#/components/schemas/InvoicePayment"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [Invoices]
      summary: Record an invoice payment
      operationId: createInvoicePayment
      description: >-
        Records a partial or full payment. A payment equal to the remaining due
        amount marks the invoice paid; partial payments leave it open. Draft
        invoices and overpayments are rejected. Requires `canManageInvoices`.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoicePaymentCreate"
      responses:
        "201":
          description: Recorded invoice payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePayment"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }

  /api/v2/invoices/{id}/payments/{paymentId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: paymentId
        in: path
        required: true
        schema: { type: string }

    delete:
      tags: [Invoices]
      summary: Delete a manually recorded invoice payment
      operationId: deleteInvoicePayment
      description: >-
        Removes a payment that was recorded by hand and recalculates the
        invoice's amount due and state from the payments that remain, so a
        paid invoice becomes open again. Requires an owner/admin key or a
        manager with `canManageInvoices`. Payments that came from a gateway,
        an accounting integration, a retainer or an import are refused with a
        409 and must be reversed where they were made. When the payment has a
        Xero or QuickBooks copy, that copy is reversed first exactly as the
        web does: `deleted` is true only once the reversal is confirmed
        (`accounting_sync.status` `SYNCED`) or there was nothing to reverse
        (`NOT_APPLICABLE`); otherwise the payment is kept in Keito, `outcome`
        is `kept_in_keito` and `message` says why. Send an `Idempotency-Key` to
        make retries safe: a completed deletion is replayed for 24 hours, while
        a refusal or a payment kept in Keito releases the key so the same
        request can be retried. Servers that offer this route advertise
        `invoice-payment-delete` in `X-Keito-Features`.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      responses:
        "200":
          description: Deletion outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePaymentDeletion"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            The payment was not recorded manually, or the `Idempotency-Key`
            was already used for a different request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ─── REPORTS ───────────────────────────────────────────────────
  /api/v2/projects/{projectId}/budget_summary:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Projects]
      summary: Read-only monetary budget progress
      operationId: getProjectMoneyBudgetSummary
      description: |
        Explicit opt-in aggregate view for active internal standard members.
        Owners and administrators retain their existing financial authority
        on this dedicated surface, including unassigned projects. Other users
        require `canViewAssignedProjectMoneyBudgets` on an active project
        assignment, or `canViewManagedProjectMoneyBudgets` and a manager role
        with an active project-manager assignment. Grants default off. The
        server rollout flag can disable this surface without altering legacy
        financial access. Client and restricted accountant memberships, MCP
        connections, read-only sync and cost-rate scoped keys are denied.

        Supports monetary project and task-fee budgets only. Monetary project
        budgets use their configured billable spending basis, including
        expenses when configured. Internal-cost budgets are excluded.
        Monthly budgets report the current month, with no all-time task rows.
        Currency follows the project client's currency, falling back to the
        workspace currency. Rates, costs, invoices, names and time entries
        are excluded. Aggregate spending may still allow rate inference.

        Existing project, task, report and billing API responses are unchanged.
        This is a safe read and grants no editing or invoicing capabilities.
      parameters:
        - name: include_inactive_tasks
          in: query
          schema: { type: boolean, default: false }
          description: Include archived task budgets and their historical spend.
      responses:
        "200":
          description: Allowlisted budget progress, never raw finance records
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [budget, spent, remaining, percent, isHours, isMonthly, currency, tasks]
                properties:
                  budget: { type: number }
                  spent: { type: number }
                  remaining: { type: number }
                  percent: { type: number }
                  isHours: { type: boolean, enum: [false] }
                  isMonthly: { type: boolean }
                  currency: { type: string }
                  tasks:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [taskId, budget, spent, remaining, percent, isHours, isMonthly]
                      properties:
                        taskId: { type: string }
                        budget: { type: number }
                        spent: { type: number }
                        remaining: { type: number }
                        percent: { type: number }
                        isHours: { type: boolean, enum: [false] }
                        isMonthly: { type: boolean, enum: [false] }
        "400":
          description: Invalid or conflicting query parameters
        "401":
          description: Missing or invalid authentication
        "403":
          description: Grant, role, membership, credential scope or rollout gate denied
        "404":
          description: Invisible project or monetary budget unavailable

  /api/v2/projects/{projectId}/billing_summary:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Reports]
      summary: Project billing summary
      operationId: getProjectBillingSummary
      description: |
        How much has been invoiced for one project. `invoiced` counts issued
        invoices only (open, paid, closed) per invoice currency and never sums
        across currencies; drafts are reported separately in `draft_amount`.
        `uninvoiced` follows the uninvoiced report (workspace rounding,
        historical effective billing rates, the workspace approval policy) and
        `budget` is the project budget report row when the project has one.

        Access follows the uninvoiced report: an owner/admin, or a manager with
        both `canViewBillableRates` and `canViewInvoices`, limited to projects
        they actively manage; other projects and cross-workspace ids read as
        404. Personal read-only sync keys are not admitted. AI app connections
        (MCP connector tokens) also need the `can_view_financial_reports`
        capability and never see calendar-derived time in the uninvoiced
        figures (`calendar_time_excluded: true`).

        `from` and `to` (YYYYMMDD or YYYY-MM-DD, at most 365 days) narrow both
        the invoices by issue date and the uninvoiced work by spent date; give
        both or neither.
      x-codeSamples:
        - lang: cURL
          source: |
            curl "https://app.keito.ai/api/v2/projects/$PROJECT_ID/billing_summary?from=20260901&to=20260930" \
              -H "Authorization: Bearer $KEITO_API_KEY" \
              -H "Keito-Account-Id: $KEITO_ACCOUNT_ID"
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string }
          description: Window start (YYYYMMDD or YYYY-MM-DD). Requires `to`.
        - name: to
          in: query
          required: false
          schema: { type: string }
          description: Window end (YYYYMMDD or YYYY-MM-DD). Requires `from`.
        - $ref: "#/components/parameters/exclude_calendar"
      responses:
        "200":
          description: Project billing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBillingSummary"
              example:
                project:
                  id: clxproject123
                  name: Review Platform
                  code: REVIEW
                  client: { id: clxclient123, name: Review Client }
                  currency: GBP
                  is_fixed_fee: false
                  is_active: true
                period: { from: "2026-09-01", to: "2026-09-30" }
                invoiced:
                  amount: 1250
                  currency: GBP
                  by_currency:
                    - { currency: GBP, amount: 1250 }
                  draft_amount: 300
                invoices_by_state: { draft: 1, open: 1, paid: 0, closed: 0, voided: 0 }
                uninvoiced:
                  hours: 1.25
                  time_amount: 125
                  expense_amount: 1.5
                  amount: 126.5
                  currency: GBP
                budget: null
                calendar_time_excluded: true
                includes_unapproved_billable_work: false
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrCapabilityRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

