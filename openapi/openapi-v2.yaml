  /api/v2/invoices:
    get:
      tags: [Invoices]
      summary: List invoices
      operationId: listInvoices
      description: >-
        Requires the `can_view_invoices` capability reported by
        `GET /api/v2/users/me`: owners and admins always, managers only with
        the `canViewInvoices` grant. Any other API key or first-party token
        receives a 403 with `Insufficient permissions to view invoices`. An AI
        app connection (MCP connector token) whose member lacks the capability
        receives a 403 with `error: mcp_capability_required` and
        `capability: can_view_invoices` instead. Servers that enforce this gate
        advertise `invoice-view-permission-gate` in `X-Keito-Features`.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: client_id
          in: query
          schema: { type: string }
        - name: state
          in: query
          style: form
          explode: true
          description: >-
            Invoice states to include. Repeat the parameter
            (`state=open&state=paid`) or pass one comma-separated value
            (`state=open,paid`); values are case-insensitive. An unknown value
            is a 400 `Invalid invoice state`. Omit it for every state.
          schema:
            type: array
            items: { type: string, enum: [draft, open, paid, closed, voided] }
        - name: overdue
          in: query
          description: >-
            `true` returns only open invoices with a balance due whose due date
            has passed in the workspace timezone — an invoice is never overdue
            on its due date. It narrows `state` to `open`; combining it with a
            `state` list that excludes `open` is a 400
            `overdue=true requires state to include open`. Any value other than
            `true` or `false` is a 400.
          schema: { type: boolean }
        - name: include_line_items
          in: query
          description: >-
            `false` omits `line_items` from every row, for a lighter list. Any
            value other than `true` or `false` is a 400.
          schema: { type: boolean, default: true }
        - name: from
          in: query
          schema: { type: string, format: date }
          description: Issue date start
        - name: to
          in: query
          schema: { type: string, format: date }
          description: Issue date end
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
        - name: owner_id
          in: query
          schema: { type: string }
          description: Eligible workspace member ID, or `unassigned`.
      responses:
        "200":
          description: Paginated list of invoices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      invoices:
                        type: array
                        items:
                          $ref: "#/components/schemas/Invoice"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrCapabilityRequired" }

    post:
      tags: [Invoices]
      summary: Create an invoice
      operationId: createInvoice
      description: >-
        Requires an owner/admin key or a manager with the
        `canEditDraftInvoices` permission. When `tax` or `tax2` is omitted, the
        client VAT default is used, then the workspace invoice default. The
        body is accepted with or without a JSON `Content-Type`. Send an
        `Idempotency-Key` to make retries safe: a refused request (unknown
        client, invalid body, failed import whose draft was removed) releases
        the key, a created draft is replayed for 24 hours. AI app connections
        need the `can_create_invoices` capability.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCreate"
      responses:
        "200":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrCapabilityRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "413": { description: Request body exceeds 524288 bytes. }

  /api/v2/invoices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }

    get:
      tags: [Invoices]
      summary: Get an invoice
      operationId: getInvoice
      description: >-
        Requires the `can_view_invoices` capability, as for `GET /api/v2/invoices`;
        otherwise a 403. An invoice outside the caller's company is a 404.
      responses:
        "200":
          description: Invoice with line items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "403": { $ref: "#/components/responses/ForbiddenOrCapabilityRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [Invoices]
      summary: Update an invoice
      operationId: updateInvoice
      description: Requires manager or admin permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      tags: [Invoices]
      summary: Delete an invoice
      operationId: deleteInvoice
      description: Admin only. Can only delete draft invoices.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  deleted: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v2/invoices/{id}/pdf:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }

    get:
      tags: [Invoices]
      summary: Download an invoice PDF
      operationId: downloadInvoicePdf
      description: >-
        Returns the current rendered invoice as a private PDF download. The
        invoice must belong to the API key's workspace.
      responses:
        "200":
          description: Rendered invoice PDF
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v2/invoices/{id}/attachments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }

    get:
      tags: [Invoices]
      summary: List invoice attachments
      operationId: listInvoiceAttachments
      description: >-
        Files attached to the invoice, including generated time reports
        (`kind: time_report`). Uploaded files ride along as real email
        attachments when the invoice is sent with `include_attachments`.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: Paginated list of invoice attachments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      invoice_attachments:
                        type: array
                        items:
                          $ref: "#/components/schemas/InvoiceAttachment"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [Invoices]
      summary: Upload an invoice attachment
      operationId: uploadInvoiceAttachment
      description: >-
        Adds a supporting file to a draft or open invoice. Paid, closed and
        voided invoices are read-only. Limits: 9 MB per file, 10 files and
        50 MB in total per invoice. Accepted types: PDF, JPEG, PNG, GIF, WebP,
        Word (.doc/.docx), Excel (.xls/.xlsx), CSV and plain text. Browsers that
        send an empty or generic MIME type are resolved from the file extension.
        Requires an owner/admin key or a manager with the matching invoice
        permission (`canEditDraftInvoices` for drafts, `canManageInvoices` for
        open invoices).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created invoice attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceAttachment"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      tags: [Invoices]
      summary: Delete an invoice attachment
      operationId: deleteInvoiceAttachment
      description: Removes a file from a draft or open invoice.
      parameters:
        - name: attachment_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Attachment removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v2/invoices/{id}/attachments/{attachmentId}/download:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string }

    get:
      tags: [Invoices]
      summary: Download an invoice attachment
      operationId: downloadInvoiceAttachment
      description: >-
        Streams the stored file with `Content-Disposition: attachment`,
        `X-Content-Type-Options: nosniff` and `Cache-Control: private, no-store`.
      responses:
        "200":
          description: Attachment file
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── ESTIMATES ─────────────────────────────────────────────────
  /api/v2/estimates:
    get:
      tags: [Estimates]
      summary: List estimates
      operationId: listEstimates
      description: >-
        Any workspace member's API key may list estimates. An AI app connection
        is admitted only when its member is a manager with `canViewInvoices`
        (estimates have no view permission of their own); otherwise a 403 with
        `error: mcp_capability_required` and `capability: can_view_invoices`.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: client_id
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [draft, sent, viewed, accepted, declined, expired] }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: owner_id
          in: query
          schema: { type: string }
          description: Eligible workspace member ID, or `unassigned`.
      responses:
        "200":
          description: Paginated list of estimates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      estimates:
                        type: array
                        items:
                          $ref: "#/components/schemas/Estimate"
        "401": { $ref: "#/components/responses/Unauthorized" }

    post:
      tags: [Estimates]
      summary: Create an estimate
      operationId: createEstimate
      description: >-
        Requires `canManageEstimates` manager permission or admin. The body is
        accepted with or without a JSON `Content-Type`; numeric fields also
        accept numeric strings. An `Idempotency-Key` makes retries safe for 24
        hours; invalid bodies, unknown clients and ineligible owners never
        consume it. AI app connections need the `can_manage_estimates`
        capability.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateCreate"
      responses:
        "200":
          description: Created estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrCapabilityRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }

  /api/v2/estimates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }

    get:
      tags: [Estimates]
      summary: Get an estimate
      operationId: getEstimate
      responses:
        "200":
          description: Estimate with line items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [Estimates]
      summary: Update an estimate
      operationId: updateEstimate
      description: Requires `canManageEstimates` manager permission or admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateUpdate"
      responses:
        "200":
          description: Updated estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      tags: [Estimates]
      summary: Delete an estimate
      operationId: deleteEstimate
      description: Requires `canManageEstimates`; only draft estimates can be deleted.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  deleted: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v2/estimates/{id}/send:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [Estimates]
      summary: Mark an estimate as sent
      operationId: sendEstimate
      description: >-
        Moves the estimate to `sent` and records an activity row with no
        recipients. No email is delivered by this endpoint. Requires
        `canManageEstimates`; refused for estimates with no line items and for
        accepted or declined estimates. An `Idempotency-Key` makes retries
        safe; a refused request never consumes it. AI app connections need the
        `can_manage_estimates` capability.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      responses:
        "200":
          description: Estimate marked as sent
          content:
            application/json:
              schema:
                type: object
                required: [id, state]
                properties:
                  id: { type: string }
                  state: { type: string, example: SENT }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrCapabilityRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }

  /api/v2/estimates/{id}/accept:
