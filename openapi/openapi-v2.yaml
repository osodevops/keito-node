              example:
                results:
                  - id: clxtaskdesign
                    name: Design
                    percent_of_total: 52.38
                    total_hours: 2.75
                    billable_hours: 2.25
                    non_billable_hours: 0.5
                    fixed_fee_hours: 0
                    currency: GBP
                    billable_amount: 225
                    rate: 100
                    billable_amounts: [{ currency: GBP, amount: 225 }]
                    rates: [{ currency: GBP, rate: 100 }]
                  - id: clxtaskreview
                    name: Review
                    percent_of_total: 47.62
                    total_hours: 2.5
                    billable_hours: 2.5
                    non_billable_hours: 0
                    fixed_fee_hours: 0
                    currency: null
                    billable_amount: null
                    rate: null
                    billable_amounts: [{ currency: GBP, amount: 50 }, { currency: USD, amount: 160 }]
                    rates: [{ currency: GBP, rate: 100 }, { currency: USD, rate: 80 }]
                summary:
                  total_hours: 5.25
                  billable_hours: 4.75
                  non_billable_hours: 0.5
                  fixed_fee_hours: 0
                  billable_percent: 90.48
                  amounts_visible: true
                  billable_amounts:
                    - { currency: GBP, amount: 275 }
                    - { currency: USD, amount: 160 }
                  rounding:
                    mode: min_15
                    description: rounded to the nearest 15 minutes
                per_page: 100
                total_pages: 1
                total_entries: 2
                next_page: null
                previous_page: null
                page: 1
                links:
                  first: /api/v2/reports/time/tasks?page=1&from=20260907&to=20260913&per_page=100
                  next: null
                  previous: null
                  last: /api/v2/reports/time/tasks?page=1&from=20260907&to=20260913&per_page=100
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/WorkspaceMismatch" }

  # ─── WORKSPACE BACKUP ────────────────────────────────────────
  /api/v2/retainers:
    get:
      tags: [Retainers]
      summary: List retainers with corrected ledger balances
      operationId: listRetainers
      description: |
        Read-only financial access for owners, administrators, and managers with
        invoice-view permission, using normal full-access API credentials or a
        WorkOS JWT. MCP connector, personal read-only sync, and scoped automation
        credentials do not gain access to retainers.

        Balances use the current corrected Keito ledger, excluding currently
        voided activities. Optional `as_of` includes every activity dated on or
        before that calendar date, including corrections entered later. It does
        not reconstruct what was recorded at the time. Without `as_of`, all
        current non-voided activities are included, even future-dated activities.
        Status and other retainer metadata are current, regardless of `as_of`.
        Amounts are exact decimal strings in each retainer's currency. Do not sum
        different currencies. Imported history may be incomplete.

        Retainers are ordered by creation time, then ID. Each response is a
        consistent read; separate pages are not an immutable snapshot. Follow all
        pages and avoid concurrent ledger changes while collecting month-end
        figures. Unknown or repeated query parameters are rejected.
      parameters:
        - $ref: "#/components/parameters/page"
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 100 }
        - name: client_id
          in: query
          schema: { type: string, minLength: 1, maxLength: 191 }
        - name: status
          in: query
          description: Current retainer status; omitted includes both states.
          schema: { type: string, enum: [ACTIVE, ARCHIVED] }
        - $ref: "#/components/parameters/retainerAsOf"
      responses:
        "200":
          description: Paginated retainers and their computed balances
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    required: [retainers]
                    properties:
                      retainers:
                        type: array
                        items: { $ref: "#/components/schemas/RetainerBalance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v2/retainers/{retainerId}:
    get:
      tags: [Retainers]
      summary: Get a retainer with its corrected ledger balance
      operationId: getRetainer
      description: |
        Uses the same financial permission and current-corrected-ledger contract
        as the retainer list. Returns 404 for an unknown retainer or a retainer
        outside the selected account. Only `as_of` is accepted as a query
        parameter; repeated or unknown parameters are rejected. This endpoint
        does not create, change, or archive retainers.
      parameters:
        - name: retainerId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 191 }
        - $ref: "#/components/parameters/retainerAsOf"
      responses:
        "200":
          description: Retainer and its computed balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetainerBalance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v2/backup:
    get:
      tags: [Backup]
      summary: Get the workspace backup manifest
      operationId: getWorkspaceBackupManifest
      description: |
        Returns the versioned list of portable workspace resources and record counts.
        Only workspace owners and administrators can use backup endpoints. Download
        every page of every resource to produce a complete portable backup.
      responses:
        "200":
          description: Backup manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupManifest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v2/backup/{resource}:
    get:
      tags: [Backup]
      summary: Download one page of a backup resource
      operationId: getWorkspaceBackupResource
      description: |
        Returns records in deterministic creation order. Decimal and bigint values
        are strings to preserve precision. This endpoint has its own versioned backup
        contract and does not change the response shape of the normal API v2 endpoints.

        For `resource=retainers`, owners and administrators with full-access API
        credentials can read the current retainer records and their nested
        activities, including voided activities. Use `scope` and
        `coverage_project_id` to interpret project versus client-wide coverage;
        client-wide retainers have a null `coverage_project_id`. The legacy
        project anchor is not the coverage definition. Current statuses are
        `ACTIVE` and `ARCHIVED`, and activity types are `ADD_FUNDS`, `DRAW`, and
        signed `ADJUSTMENT` values. Amounts are decimal strings.

        Activity `balance_after` values are stored snapshots and are not
        recalculated across the ledger after backdating, edits, or voids. For
        corrected balances, sum current non-voided activity amounts by type and
        activity date, or use `GET /api/v2/retainers?as_of=YYYY-MM-DD`.

        Only the pagination query parameters below are supported. This backup
        does not calculate retainer balances, filter by `client_id` or `status`,
        or implement `as_of`. It is a current export, not an immutable historical
        snapshot: activities can be corrected, voided, or removed later. Follow
        every page before reconciling an export. Personal read-only sync keys
        and MCP connector credentials cannot access this backup endpoint.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [workspace, members, roles, teammate_assignments, clients, projects, tasks, time_entries, expense_categories, expenses, invoice_settings, bank_accounts, invoice_item_categories, invoices, estimates, retainers, recurring_invoices, planning_assignments, planning_placeholders, planning_time_off, planning_working_patterns, planning_milestones, time_off_types, time_off_allowances, company_holidays, saved_reports, invitations, webhook_endpoints, audit_logs]
        - $ref: "#/components/parameters/page"
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
          description: Backup pages are capped at 500 records because records can contain nested detail.
      responses:
        "200":
          description: Paginated backup records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupResourcePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v2/backup/files/invoice_expense_receipts/{id}:
    get:
      tags: [Backup]
      summary: Download an invoice's immutable expense receipt copy
      operationId: downloadBackupInvoiceExpenseReceipt
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Receipt file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key (kto_...) or WorkOS JWT

  parameters:
    exclude_calendar:
      name: exclude_calendar
      in: query
      required: false
      schema: { type: boolean }
      description: >-
        Set to true to exclude calendar-derived time, including entries with
        retained calendar provenance under another source. Ordinary API clients
        default to false; MCP OAuth connections always exclude this time even
        if false is supplied. Only the exact values true and false are accepted;
        repeated values return 400. Pagination links retain this option.
        In project billing summaries this filters uninvoiced work only; issued
        invoice amounts and all-source project budgets are not recalculated.
        Not available to personal read-only sync keys.
    retainerAsOf:
      name: as_of
      in: query
      description: |
        Inclusive activity calendar date in YYYY-MM-DD format (UTC). Must be a
        real date. Late-entered activities dated through this date count;
        currently voided activities do not. Omitted includes all current activity
        dates. This is a corrected-ledger cutoff, not a recorded-at-time snapshot.
      schema: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$', example: "2026-10-31" }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    per_page:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 2000, default: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for safely retrying the same mutation for 24 hours.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: '^[A-Za-z0-9._-]+$'
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique key for safely retrying the same mutation for 24 hours.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: '^[A-Za-z0-9._-]+$'

  headers:
    IdempotencyReplayed:
      description: Present (`true`) when the response was replayed from an earlier request with the same `Idempotency-Key`.
      schema: { type: string, enum: ["true"] }

  responses:
    IdempotencyConflict:
      description: |
        The `Idempotency-Key` was already used for a different request (`key_reused`), the original
        request ran under different permissions (`authorization_changed`), is still processing
        (`in_progress`), or never finished (`idempotency_unresolved` — read the resource before
        retrying with a new key).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IdempotencyOrDomainConflict:
      description: |
        A conflict described by `message` (for example an approved, locked or already-running
        entry), or an `Idempotency-Key` conflict (`key_reused`, `authorization_changed`,
        `in_progress`, `idempotency_unresolved`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IdempotencyDomainOrWorkspaceConflict:
      description: |
        A conflict described by `message` (for example `running_timer_conflict`, a timer that is
        not running, or an approved-week lock), an `Idempotency-Key` conflict (`key_reused`,
        `authorization_changed`, `in_progress`, `idempotency_unresolved`), or — for an AI app
        connection whose `Keito-Account-Id` names a workspace other than the one it is bound
        to — `workspace_mismatch` with `bound_company_id`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/WorkspaceMismatch"
    WorkspaceMismatch:
      description: |
        The request came from an AI app connection (MCP connector token) that is bound to one
        workspace, and `Keito-Account-Id` named another. Every route an AI app may reach returns
        this; the app should re-read `GET /api/v2/users/me` and use `bound_company_id`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkspaceMismatch" }
    ForbiddenOrCapabilityRequired:
      description: |
        Forbidden by the route's role or permission rule, or — for an AI app
        connection (MCP connector token) whose member lacks the capability the
        route needs — `error: mcp_capability_required` with the `capability`
        name as it appears under `capabilities` on `GET /api/v2/users/me`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/McpCapabilityRequired"
    InvoiceConfirmationOrIdempotencyConflict:
      description: |
        `confirmation_mismatch`: the invoice's current amount, currency or
        recipient count differs from `confirm`; `expected` and `received` say
        how, and nothing changed. Or an `Idempotency-Key` conflict
        (`key_reused`, `authorization_changed`, `in_progress`, `idempotency_unresolved`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/InvoiceConfirmationMismatch"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    ExpenseReimbursementClassification:
      type: object
      additionalProperties: false
      required: [expense_id, reimbursable, expense_version]
      properties:
        expense_id: { type: string }
        reimbursable:
          type: boolean
          nullable: true
          description: True is reimbursable, false is not reimbursable, and null is Not classified.
        expense_version: { type: integer, minimum: 1 }
    ExpenseReimbursementClassificationUpdate:
      type: object
      additionalProperties: false
      required: [reimbursable, expected_expense_version]
      properties:
        reimbursable:
          type: boolean
          nullable: true
          description: Explicit classification; use null for Not classified.
        expected_expense_version:
          type: integer
          minimum: 1
          description: expense_version from the most recent classification GET.
    # ── Common ─────────────────────────────────────────────────
    Error:
      type: object
      properties:
        error:
          type: string
          example: bad request
        error_description:
          type: string
          example: project_id is required
        message:
          type: string
          example: project_id is required

    WorkspaceMismatch:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [error, bound_company_id]
          properties:
            error: { type: string, enum: [workspace_mismatch] }
            bound_company_id:
              type: string
              description: The workspace the AI app connection is bound to.

    McpCapabilityRequired:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [error, capability]
          properties:
            error: { type: string, enum: [mcp_capability_required] }
            capability:
              type: string
              description: The `capabilities` key on `GET /api/v2/users/me` the member must hold.
              enum:
                - can_track_time
                - can_track_expenses
                - can_edit_time_billability
                - can_create_field_clients
                - can_view_team_time
                - can_view_invoices
                - can_create_invoices
                - can_send_invoices
                - can_record_invoice_payments
                - can_manage_estimates
                - can_create_projects
                - can_view_financial_reports
                - can_view_billable_rates

    InvoiceConfirmationMismatch:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [error, expected, received]
          properties:
            error: { type: string, enum: [confirmation_mismatch] }
            expected:
              type: object
              description: The invoice's current `amount` (two-decimal string) and `currency`, or `recipient_count`.
              additionalProperties: true
            received:
              type: object
              additionalProperties: true

    UserCapabilities:
      type: object
      description: >-
        What the authenticated member may do through API v2. `can_view_invoices`
        follows the granular view-invoices permission (managers who can edit or
        send invoices always hold it too). AI app connections are refused with
        `mcp_capability_required` on routes whose capability is false here.
      required:
        - can_track_time
        - can_track_expenses
        - can_edit_time_billability
        - can_create_field_clients
        - can_view_team_time
        - can_view_invoices
        - can_create_invoices
        - can_send_invoices
        - can_record_invoice_payments
        - can_manage_estimates
        - can_create_projects
        - can_view_financial_reports
        - can_view_billable_rates
      properties:
        can_track_time: { type: boolean }
        can_track_expenses: { type: boolean }
        can_edit_time_billability: { type: boolean }
        can_create_field_clients: { type: boolean, description: "Manager with `canEditClientsAndTasks`, or owner/admin." }
        can_view_team_time: { type: boolean }
        can_view_invoices: { type: boolean, description: "Manager with `canViewInvoices`, or owner/admin." }
        can_create_invoices: { type: boolean, description: "Manager with `canEditDraftInvoices`, or owner/admin." }
        can_send_invoices: { type: boolean, description: "Manager with `canManageInvoices`, or owner/admin." }
        can_record_invoice_payments: { type: boolean }
        can_manage_estimates: { type: boolean, description: "Manager with `canManageEstimates`, or owner/admin." }
        can_create_projects: { type: boolean }
        can_view_financial_reports: { type: boolean, description: "Manager with both `canViewBillableRates` and `canViewInvoices`, or owner/admin." }
        can_view_billable_rates: { type: boolean, description: "Manager with `canViewBillableRates`, or owner/admin. The same grant that reveals `hourly_rate`, task rates and `default_hourly_rate` on reads." }

    RunningTimerConflict:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            running_entry:
              $ref: "#/components/schemas/TimeEntry"
            running_entry_count:
              type: integer
              minimum: 1

    PaginationLinks:
      type: object
      properties:
        first: { type: string }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        last: { type: string }

    PaginationEnvelope:
      type: object
      properties:
        per_page: { type: integer }
        total_pages: { type: integer }
        total_entries: { type: integer }
        page: { type: integer }
        links: { $ref: "#/components/schemas/PaginationLinks" }

    BackupManifest:
      type: object
      required: [backup_schema_version, generated_at, workspace, resources, excluded, notes]
      properties:
        backup_schema_version: { type: integer, example: 1 }
        generated_at: { type: string, format: date-time }
        workspace:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        resources:
          type: array
          items:
            type: object
            required: [name, description, total_entries, endpoint]
            properties:
              name: { type: string }
              description: { type: string }
              total_entries: { type: integer }
              endpoint: { type: string }
        excluded:
          type: array
          items: { type: string }
        notes:
          type: array
          items: { type: string }

    BackupResourcePage:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          required: [backup_schema_version, resource, records]
          properties:
            backup_schema_version: { type: integer, example: 1 }
            resource: { type: string }
            records:
              type: array
              items:
                type: object
                additionalProperties: true
              description: Resource-specific backup records with snake_case keys.

    IdName:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true

    Metadata:
      type: object
      nullable: true
      additionalProperties: true
      description: Arbitrary JSON object, max 4 KB serialized.

    ExternalReference:
      type: object
      required: [id]
      nullable: true
      description: |
        Links a time entry to an object in another system, such as a ticket, issue or task.
        Keito shows it as a linked chip on the Day view, in the time entry dialog and in the
        Detailed Time report; the chip opens `permalink` and is labelled with `display_name`
        (falling back to `id`). `id` is required whenever `external_reference` is sent; every
        other field is optional. Send `null` (or use `DELETE .../external_reference`) to remove it.
      properties:
        id: { type: string, maxLength: 255, description: Identifier of the external object. Required. }
        group_id: { type: string, maxLength: 255, nullable: true, description: "Optional group or scope identifier, such as a project or board." }
        account_id: { type: string, maxLength: 255, nullable: true, description: Optional account or tenant identifier in the external system. }
        permalink:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: Link to the external object. Must be an absolute `http` or `https` URL.
        service: { type: string, maxLength: 100, nullable: true, example: zendesk.com }
        service_name: { type: string, maxLength: 255, nullable: true, example: Zendesk }
        display_name: { type: string, maxLength: 255, nullable: true, example: "#4821 Invoice export fails", description: Human-readable label for the chip. }
        group_name: { type: string, maxLength: 255, nullable: true, example: Support queue, description: Human-readable name for `group_id`. }
        parent_id: { type: string, maxLength: 255, nullable: true, description: "Optional parent object identifier, such as the epic of an issue." }

    ExternalReferenceSummary:
      type: object
      required: [total_hours, my_hours, entry_count, last_used, my_running_entry_id]
      properties:
        total_hours: { type: number }
        my_hours: { type: number }
        entry_count: { type: integer }
        last_used:
          type: object
          nullable: true
          properties:
            project_id: { type: string }
            project_name: { type: string }
            task_id: { type: string }
            task_name: { type: string }
        my_running_entry_id: { type: string, nullable: true }

    # ── Time Entries ───────────────────────────────────────────
    SyncTaskAssignment:
      type: object
      nullable: true
      required: [id, billable, is_active]
      description: Minimal project-specific task assignment returned to personal read-only sync credentials. Rates, budgets, and aggregate totals are excluded.
      properties:
        id: { type: string }
        billable: { type: boolean }
        is_active: { type: boolean }

    TimeEntry:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        project_id: { type: string }
        task_id: { type: string }
        task_assignment: { $ref: "#/components/schemas/SyncTaskAssignment" }
        user: { $ref: "#/components/schemas/IdName" }
        project: { $ref: "#/components/schemas/IdName" }
        task: { $ref: "#/components/schemas/IdName" }
        spent_date: { type: string, format: date }
        hours:
          type: number
          description: Legacy stored decimal-hours value. Existing integrations can continue using this field unchanged.
        duration_seconds:
          type: integer
          minimum: 0
          description: Actual saved duration in seconds before workspace rounding.
        rounded_hours:
          type: number
          minimum: 0
          description: Hours after applying the workspace time-rounding policy; used by totals, reports, budgets, and new invoice quantities.
        notes: { type: string, nullable: true }
        is_running: { type: boolean }
        timer_started_at: { type: string, format: date-time, nullable: true }
        started_time: { type: string, nullable: true, description: "HH:mm" }
        ended_time: { type: string, nullable: true, description: "HH:mm" }
        approval_status:
          type: string
          enum: [unsubmitted, submitted, approved, rejected]
          description: |
            Keito timesheet approval state. This is the authoritative approval field: time approved
            in Keito reports `approved` (and `is_locked: true`) while `is_closed` stays `false`.
            Omitted from personal read-only sync responses.
        is_locked:
          type: boolean
          description: The entry cannot be edited, for example because it was approved or invoiced.
        is_closed:
          type: boolean
          description: |
            Harvest compatibility flag. `true` only for entries imported from Harvest that Harvest
            had approved. It is not set by Keito's own approval workflow; use `approval_status`.
        is_billed: { type: boolean }
        invoice_id:
          type: string
          nullable: true
          readOnly: true
          description: Keito invoice CUID linked directly or through a grouped invoice line. Null when no local invoice line links the entry, including manually billed or historical imported entries without a link. Never a Harvest invoice ID. Omitted from personal read-only sync responses. Invoice access permissions are unchanged.
        billable: { type: boolean }
        budgeted: { type: boolean }
        billable_rate:
          type: number
          nullable: true
          description: Stored historical billable rate. Omitted unless authorized for this project.
        source:
          type: string
          enum: [web, cli, api, agent, calendar, desktop, mobile, integration, extension]
        metadata: { $ref: "#/components/schemas/Metadata" }
        external_reference: { $ref: "#/components/schemas/ExternalReference" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApprovalSubmitRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { type: string, format: date, description: First day of the period (YYYY-MM-DD). }
        to: { type: string, format: date, description: "Last day of the period (YYYY-MM-DD), at most 366 days after `from`." }
        fingerprint:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Optional snapshot from a previous submit response; the request fails if the period changed since.

    ApprovalSubmitResult:
      type: object
      required: [submitted_count, submitted_seconds, fingerprint]
      properties:
        submitted_count: { type: integer, minimum: 0 }
        submitted_seconds: { type: integer, minimum: 0 }
        fingerprint: { type: string, description: Snapshot of the period that was submitted. }

    ApprovalReviewScope:
      type: object
      required: [user_id, from, to]
      properties:
        user_id: { type: string, description: The person whose time is reviewed. }
        from: { type: string, format: date }
        to: { type: string, format: date, description: "At most 366 days after `from`." }
        project_id: { type: string, description: Limit the review to one project. }

    ApprovalApproveRequest:
      allOf:
        - $ref: "#/components/schemas/ApprovalReviewScope"
        - type: object
          properties:
            preflight_fingerprint:
              type: string
              pattern: "^[a-f0-9]{64}$"
              description: "`preflight.fingerprint` from a 409 response. Required when the scope has warnings."
            acknowledged_warning_codes:
              type: array
              maxItems: 3
              items: { type: string, enum: [HOURS_BELOW_EXPECTED, TIME_OUTSIDE_WORKING_CAPACITY, OVERLAPPING_TIMESTAMP_ENTRIES] }
              description: Every current warning code must be listed.
      description: Unknown properties are rejected.

    ApprovalRejectRequest:
      allOf:
        - $ref: "#/components/schemas/ApprovalReviewScope"
        - type: object
          properties:
            reason: { type: string, maxLength: 2000, description: Sent to the person in the rejection notification. }
      description: Unknown properties are rejected.

    ApprovalActionResult:
      type: object
      required: [time_entry_count, expense_count]
      properties:
        time_entry_count: { type: integer, minimum: 0 }
        expense_count: { type: integer, minimum: 0 }

    ApprovalApproveResult:
      allOf:
        - $ref: "#/components/schemas/ApprovalActionResult"
        - type: object
          required: [preflight_fingerprint, acknowledged_warning_codes]
          properties:
            preflight_fingerprint: { type: string }
            acknowledged_warning_codes: { type: array, items: { type: string } }

    ApprovalPreflightIssue:
      type: object
      properties:
        code:
          type: string
          enum: [PARTIAL_SUBMISSION, RUNNING_TIMER, MISSING_REQUIRED_NOTES, INVALID_WORK_CONTEXT, HOURS_BELOW_EXPECTED, TIME_OUTSIDE_WORKING_CAPACITY, OVERLAPPING_TIMESTAMP_ENTRIES]
        severity: { type: string, enum: [blocker, warning] }
        count: { type: integer }
        summary: { type: string }
        dates: { type: array, items: { type: string, format: date } }
        records:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string, enum: [time_entry, expense] }
              date: { type: string, format: date }

    ApprovalPreflight:
      type: object
      properties:
        fingerprint: { type: string }
        can_approve: { type: boolean }
        submitted_time_entry_count: { type: integer }
        submitted_expense_count: { type: integer }
        blockers: { type: array, items: { $ref: "#/components/schemas/ApprovalPreflightIssue" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/ApprovalPreflightIssue" } }

    ApprovalConflict:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            error:
              type: string
              enum: [approval_blocked, approval_warnings_unacknowledged, approval_preflight_stale, approval_conflict]
            preflight: { $ref: "#/components/schemas/ApprovalPreflight" }

    TimeEntryCreate:
      type: object
      required: [project_id, task_id, spent_date]
      properties:
        project_id: { type: string }
        task_id: { type: string }
        spent_date: { type: string, format: date }
        user_id: { type: string, description: Managers can create entries for other users. }
        hours: { type: number, minimum: 0, maximum: 24 }
        notes: { type: string }
        billable: { type: boolean }
        is_running: { type: boolean, description: "When true without started_time, the timer starts now and uses the current date in the user's effective timezone, regardless of spent_date. To backdate a running timer, provide both spent_date and started_time; past starts require the workspace setting and future starts are rejected." }
        replace_running: { type: boolean, description: "When true with is_running, stop any currently running timer before creating this one. When false or omitted with is_running, the API returns 409 if another timer is already running." }
        started_time: { type: string, description: "HH:mm. When supplied with is_running, combines with spent_date to resolve an explicit timer start; when omitted, a running timer starts now. Otherwise used for start/end time entries." }
        ended_time: { type: string, description: "HH:mm" }
        source:
          type: string
          enum: [web, cli, api, agent, calendar, desktop, mobile, integration]
        metadata: { $ref: "#/components/schemas/Metadata" }
        external_reference: { $ref: "#/components/schemas/ExternalReference" }

    TimeEntryUpdate:
      type: object
      properties:
        project_id: { type: string }
        task_id: { type: string }
        spent_date: { type: string, format: date }
        hours: { type: number, minimum: 0, maximum: 24 }
        notes: { type: string, nullable: true }
        billable: { type: boolean }
        started_time: { type: string, nullable: true }
        ended_time: { type: string, nullable: true }
        metadata:
          $ref: "#/components/schemas/Metadata"
          description: Merged into existing metadata. Set to null to clear.
        external_reference:
          $ref: "#/components/schemas/ExternalReference"
          description: Replaces the external reference. Set to null to remove it.

    # ── Expenses ───────────────────────────────────────────────
    Expense:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        project_id: { type: string }
        expense_category_id: { type: string }
        user: { $ref: "#/components/schemas/IdName" }
        project: { $ref: "#/components/schemas/IdName" }
        expense_category: { $ref: "#/components/schemas/ExpenseCategory" }
        spent_date: { type: string, format: date }
        total_cost: { type: number }
        currency:
          type: string
          nullable: true
          description: ISO 4217 code `total_cost` is denominated in — the client's currency when the project has one, else the workspace currency.
        units: { type: number, nullable: true, description: Quantity with up to six decimal places. }
        entry_type: { type: string, enum: [expense, refund] }
        adjustment_reason:
          type: string
          nullable: true
          enum: [returned_materials, vendor_refund, correction, imported_adjustment, other]
        adjustment_of_id: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        billable: { type: boolean }
        receipt_file_name: { type: string, nullable: true }
        receipt_file_size: { type: integer, nullable: true }
        receipt_content_type: { type: string, nullable: true }
        receipt_url: { type: string, nullable: true }
        attach_receipt_to_invoice:
          type: boolean
          description: Whether invoice creation may copy this stored receipt onto a client invoice. Sending selected receipts is a separate invoice-message choice.
        is_locked: { type: boolean }
        is_billed: { type: boolean }
        invoice_id:
          type: string
          nullable: true
          readOnly: true
          description: Keito invoice CUID linked directly or through a grouped invoice line. Null when no local invoice line links the expense, including manually billed or historical imported expenses without a link. Never a Harvest invoice ID. Invoice access permissions are unchanged.
        approval_status:
          type: string
          enum: [unsubmitted, submitted, approved, rejected]
        source:
          type: string
          enum: [web, cli, api, agent]
        metadata: { $ref: "#/components/schemas/Metadata" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExpenseReceipt:
      type: object
      properties:
        receipt_file_name: { type: string }
        receipt_file_size: { type: integer }
        receipt_content_type: { type: string }
        receipt_url:
          type: string
          description: Authenticated API v2 path for downloading the original receipt.

    ExpenseCategory:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        unit_name: { type: string, nullable: true }
        unit_price: { type: number, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExpenseUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Every field is optional; at least one is required. Unit-priced categories take `units`, fixed-price categories take `total_cost`.
      properties:
        project_id: { type: string }
        expense_category_id: { type: string }
        spent_date: { type: string, format: date }
        total_cost: { type: number, minimum: 0, exclusiveMinimum: true, nullable: true }
        units: { type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.000001, nullable: true }
        adjustment_reason:
          type: string
          enum: [returned_materials, vendor_refund, correction, imported_adjustment, other]
        notes: { type: string, nullable: true }
        billable: { type: boolean }
        attach_receipt_to_invoice: { type: boolean }
        metadata: { $ref: "#/components/schemas/Metadata" }

    ExpenseCreate:
      type: object
      additionalProperties: false
      description: |
        Creates an expense for the identity bound to the key. Amount-based categories require
        a positive total_cost and reject units; unit-priced categories require positive units
        and reject total_cost. Unit price comes from the category, never the request.
        Refunds use positive magnitudes with entry_type refund and a required adjustment_reason;
        the response contains a negative total_cost. adjustment_of_id optionally links an original
        expense. Ordinary expense creation rejects refund-only adjustment fields.
      required: [project_id, expense_category_id, spent_date]
      properties:
        project_id: { type: string }
        expense_category_id: { type: string }
        spent_date: { type: string, format: date }
        total_cost: { type: number, minimum: 0, exclusiveMinimum: true, description: Required for amount-based categories; disallowed for unit-priced categories. }
        units: { type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.000001, description: Required for unit-priced categories; up to six decimal places. }
        entry_type: { type: string, enum: [expense, refund], default: expense }
        adjustment_reason:
          type: string
          enum: [returned_materials, vendor_refund, correction, imported_adjustment, other]
          description: Required for refunds; rejected for ordinary expenses.
        adjustment_of_id:
          type: string
          description: Optional original expense ID for a refund; rejected for ordinary expenses.
        notes: { type: string }
        billable: { type: boolean }
        attach_receipt_to_invoice:
          type: boolean
          description: Whether invoice creation may copy the stored receipt; uploading the receipt and sending it by email are separate operations.
        source:
          type: string
          enum: [web, cli, api, agent]
        metadata: { $ref: "#/components/schemas/Metadata" }

    # ── Projects ───────────────────────────────────────────────
    Project:
      type: object
      properties:
        id: { type: string }
        client: { $ref: "#/components/schemas/IdName" }
        owner_id: { type: string, nullable: true }
        owner: { $ref: "#/components/schemas/RecordOwner" }
        name: { type: string }
        code: { type: string, nullable: true }
        is_active: { type: boolean }
        can_track_time:
          type: boolean
          description: >-
            Whether the bound user may put new time on this project: false for
            archived projects, true for owners and administrators on any active
            project, otherwise the user's assignment must allow time tracking.
            Servers that return it advertise `project-can-track-time` in
            `X-Keito-Features`. Absent from the personal-sync representation.
        is_billable: { type: boolean }
        is_fixed_fee: { type: boolean }
        bill_by: { type: string }
        hourly_rate:
          type: number
          nullable: true
          description: Omitted unless authorized for this project.
        fee: { type: number, nullable: true }
        budget_by: { type: string }
        budget: { type: number, nullable: true }
        budget_is_monthly: { type: boolean }
        budget_counts_billable_hours_only:
          type: boolean
          default: false
          description: When true, Total Project Hours budgets count only billable time. Ignored by other budget types.
        notify_when_over_budget: { type: boolean }
        over_budget_notification_percentage: { type: number, nullable: true }
        show_budget_to_all: { type: boolean }
        cost_budget: { type: number, nullable: true }
        cost_budget_include_expenses: { type: boolean }
        starts_on: { type: string, format: date, nullable: true }
        ends_on: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        tasks:
          type: array
          description: Active project task assignments. Task budgets are omitted when the caller cannot view the project budget.
          items:
            $ref: "#/components/schemas/Task"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectTemplate:
      type: object
      required: [id, name, project_name, client_id, task_count, people_count, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        project_name:
          type: string
          description: Default name offered for projects created from the template.
        client_id:
          type: string
          nullable: true
          description: Client the template is tied to, or null when it applies to any client.
        client_name: { type: string, nullable: true }
        is_billable: { type: boolean }
        is_fixed_fee: { type: boolean }
        bill_by: { type: string, enum: [PROJECT, TASKS, PEOPLE, NONE] }
        budget_by: { type: string, enum: [PROJECT, PROJECT_HOURS, PROJECT_COST, TASK, TASK_FEES, PERSON, NONE] }
        task_count: { type: integer }
        people_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name]
      description: "`client_id` is required unless `template_id` names a template tied to a client."
      properties:
        template_id:
          type: string
          description: Project template ID from GET /api/v2/project_templates. Only name, client_id, code, notes, owner_id, starts_on and ends_on may accompany it.
        client_id: { type: string }
        owner_id:
          type: string
          description: Eligible workspace member ID. Defaults to the authenticated caller.
        name: { type: string, minLength: 1, maxLength: 255 }
        code: { type: string, maxLength: 50 }
        notes: { type: string, maxLength: 65535 }
        is_billable: { type: boolean, default: true }
        bill_by:
          type: string
          enum: [PROJECT, TASKS, PEOPLE, NONE]
          description: Defaults to PROJECT for billable projects and NONE for non-billable projects.
        budget_by:
          type: string
          enum: [PROJECT, PROJECT_HOURS, PROJECT_COST, TASK, TASK_FEES, PERSON, NONE]
          default: NONE
        is_fixed_fee: { type: boolean, default: false }
        hourly_rate: { type: number, minimum: 0 }
        fee:
          type: number
          minimum: 0
          maximum: 99999999.99
          description: Required when is_fixed_fee is true.
        budget: { type: number, minimum: 0, maximum: 99999999.99 }
        cost_budget: { type: number, minimum: 0, maximum: 99999999.99 }
        budget_is_monthly: { type: boolean }
        budget_counts_billable_hours_only:
          type: boolean
          default: false
          description: When true, Total Project Hours budgets count only billable time. Ignored by other budget types.
        cost_budget_include_expenses: { type: boolean }
        notify_when_over_budget: { type: boolean }
        over_budget_notification_percentage: { type: number, minimum: 0, maximum: 100 }
        show_budget_to_all: { type: boolean }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, description: Must be on or after starts_on. }
        task_ids:
          type: array
          items: { type: string }
          description: >-
            Active workspace task IDs to assign. Omit to assign default tasks; pass an empty array
            to assign none. Each task's workspace default rate is converted into the client's
            currency when the two differ.

    ProjectUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        client_id: { type: string }
        name: { type: string, minLength: 1, maxLength: 255 }
        code: { type: string, maxLength: 50, nullable: true }
        notes: { type: string, maxLength: 65535, nullable: true }
        is_active: { type: boolean }
        is_billable: { type: boolean }
        bill_by: { type: string, enum: [PROJECT, TASKS, PEOPLE, NONE] }
        budget_by: { type: string, enum: [PROJECT, PROJECT_HOURS, PROJECT_COST, TASK, TASK_FEES, PERSON, NONE] }
        is_fixed_fee: { type: boolean }
        hourly_rate: { type: number, minimum: 0, maximum: 99999999.99 }
        fee: { type: number, minimum: 0, maximum: 99999999.99 }
        budget: { type: number, minimum: 0, maximum: 99999999.99 }
        cost_budget: { type: number, minimum: 0, maximum: 99999999.99 }
        budget_is_monthly: { type: boolean }
        budget_counts_billable_hours_only: { type: boolean }
        cost_budget_include_expenses: { type: boolean }
        notify_when_over_budget: { type: boolean }
        over_budget_notification_percentage: { type: number, minimum: 0, maximum: 100 }
        show_budget_to_all: { type: boolean }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, description: Must be on or after the effective starts_on. }

    RetainerBalance:
      type: object
      additionalProperties: false
      required: [id, name, client_id, project_id, scope, currency, status, created_at, updated_at, funded, drawn, adjustments, remaining, as_of, balance_basis, activity_date_basis, status_basis]
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        client_id: { type: string }
        project_id:
          type: string
          nullable: true
          description: Covered project for PROJECT scope; null for CLIENT scope. The legacy project anchor is never used as coverage.
        scope: { type: string, enum: [PROJECT, CLIENT] }
        currency: { type: string, description: Retainer currency; balances are never converted or combined across currencies. }
        status: { type: string, enum: [ACTIVE, ARCHIVED], description: Current status even when as_of is supplied. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        funded: { type: string, pattern: '^-?\d+\.\d{2}$', example: "1000.25", description: Sum of included ADD_FUNDS amounts. }
        drawn: { type: string, pattern: '^-?\d+\.\d{2}$', example: "250.10", description: Sum of included DRAW amounts. }
        adjustments: { type: string, pattern: '^-?\d+\.\d{2}$', example: "-10.05", description: Signed sum of included ADJUSTMENT amounts. }
        remaining: { type: string, pattern: '^-?\d+\.\d{2}$', example: "740.10", description: Funded plus adjustments minus drawn; may be negative. }
        as_of: { type: string, format: date, nullable: true, description: Requested inclusive cutoff; null means all current activity dates. }
        balance_basis: { type: string, enum: [current_corrected_ledger] }
        activity_date_basis: { type: string, enum: [UTC] }
        status_basis: { type: string, enum: [current] }

    # ── Clients ────────────────────────────────────────────────
    Client:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string, nullable: true }
        currency: { type: string }
        is_active: { type: boolean }
        payment_terms: { type: string }
        payment_days: { type: integer, nullable: true }
        tax: { type: number, nullable: true }
        tax2: { type: number, nullable: true }
        discount: { type: number, nullable: true }
        statement_key: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ClientMinimal:
      type: object
      description: The roster shape returned for `GET /api/v2/clients?fields=minimal`.
      additionalProperties: false
      required: [id, name, currency, is_active]
      properties:
        id: { type: string }
        name: { type: string }
        currency: { type: string, description: ISO 4217 code the client is billed in. }
        is_active: { type: boolean }

    ClientCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
        address: { type: string }
        currency: { type: string, description: 3-letter ISO code. Defaults to company currency. }
        payment_terms:
          type: string
          enum: [upon_receipt, net_15, net_30, net_45, net_60, custom]
        payment_days: { type: integer }
        tax: { type: number }
        tax2: { type: number }
        discount: { type: number }
        is_active: { type: boolean }

    ClientUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string }
        address: { type: string, nullable: true }
        currency: { type: string, description: 3-letter ISO code. }
        payment_terms:
          type: string
          enum: [company_default, upon_receipt, net_15, net_30, net_45, net_60, custom]
        payment_days: { type: integer, nullable: true }
        tax: { type: number, nullable: true }
        tax2: { type: number, nullable: true }
        discount: { type: number, nullable: true }
        is_active: { type: boolean }

    # ── Contacts ───────────────────────────────────────────────
    Contact:
      type: object
      properties:
        id: { type: string }
        client: { $ref: "#/components/schemas/IdName" }
        first_name: { type: string }
        last_name: { type: string, nullable: true }
        title: { type: string, nullable: true }
        email: { type: string, nullable: true }
        invoice_recipient_status:
          type: string
          enum: [none, recipient, cc, bcc]
        phone_office: { type: string, nullable: true }
        phone_mobile: { type: string, nullable: true }
        fax: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ContactCreate:
      type: object
      required: [client_id, first_name]
      properties:
        client_id: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        title: { type: string }
        email: { type: string }
        invoice_recipient_status:
          type: string
          enum: [none, recipient, cc, bcc]
          default: none
        phone_office: { type: string }
        phone_mobile: { type: string }
        fax: { type: string }

    # ── Tasks ──────────────────────────────────────────────────
    Task:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        billable_by_default: { type: boolean }
        default_hourly_rate:
          type: number
          nullable: true
          description: Raw task default. Omitted unless the caller has workspace-wide billable-rate visibility.
        effective_billable_rate:
          type: number
          nullable: true
          description: Current effective rate for the authenticated user and requested project/task. Returned only with project_id and authorized visibility; null for non-billable or missing-rate options.
        currency:
          type: string
          description: ISO 4217 client currency, falling back to company currency. Returned with effective_billable_rate.
        budget:
          type: number
          nullable: true
          description: Project-scoped active task-assignment budget. Returned only with project context and budget visibility; omitted for workspace-global tasks, inactive or missing assignments, and unauthorized callers. An explicit zero is returned as 0.
        is_default: { type: boolean }
        is_active: { type: boolean }
        parent_task_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectTaskCreate:
      type: object
      additionalProperties: false
      required: [project_id, name]
      properties:
        project_id: { type: string, description: Project in the authenticated workspace. }
        name: { type: string, minLength: 1, maxLength: 255 }
        billable: { type: boolean, description: Defaults to the project's billable setting. }
        hourly_rate: { type: number, nullable: true, minimum: 0, maximum: 99999999.99 }
        budget: { type: number, nullable: true, minimum: 0, maximum: 99999999.99 }

    ProjectTaskCreated:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [project_id, assignment_id]
          properties:
            project_id: { type: string }
            assignment_id: { type: string }
            billable:
              type: boolean
              description: Omitted without billable-rate visibility.
            hourly_rate:
              type: number
              nullable: true
              description: Project assignment rate. Omitted without billable-rate visibility.
            budget:
              type: number
              nullable: true
              description: Project assignment budget. Omitted without billable-rate visibility.

    # ── Project assignments ────────────────────────────────────
    ProjectUserAssignment:
      type: object
      required: [id, project, user, is_active, is_project_manager, can_track_time, can_view_project_financials, can_view_internal_costs, created_at, updated_at]
      properties:
        id: { type: string }
        project:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            code: { type: string, nullable: true }
        user: { $ref: "#/components/schemas/IdName" }
        is_active: { type: boolean }
        is_project_manager: { type: boolean }
        can_track_time: { type: boolean }
        can_view_project_financials: { type: boolean }
        can_view_internal_costs: { type: boolean }
        use_default_rates:
          type: boolean
          description: Omitted without billable-rate visibility.
        hourly_rate:
          type: number
          nullable: true
          description: Project-specific person rate when use_default_rates is false. Omitted without billable-rate visibility; read-only here.
        budget:
          type: number
          nullable: true
          description: Person hour budget (used when the project budgets by person). Omitted without billable-rate visibility.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectUserAssignmentCreate:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id: { type: string, description: "An active, assignable member of the authenticated workspace." }
        is_project_manager: { type: boolean, description: Administrator only when true. }
        can_track_time: { type: boolean, description: Defaults to true; only administrators may set false. }
        can_view_project_financials: { type: boolean, description: Administrator only when true. }
        can_view_internal_costs: { type: boolean, description: Administrator only when true; implies can_view_project_financials. }
        budget: { type: number, nullable: true, minimum: 0, maximum: 99999999.99, description: Person hour budget. Administrator only. }

    ProjectUserAssignmentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        is_active: { type: boolean }
        is_project_manager: { type: boolean }
        can_track_time: { type: boolean }
        can_view_project_financials: { type: boolean }
        can_view_internal_costs: { type: boolean }
        budget: { type: number, nullable: true, minimum: 0, maximum: 99999999.99 }

    ProjectTaskAssignment:
      type: object
      required: [id, project, task, is_active, created_at, updated_at]
      properties:
        id: { type: string }
        project:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            code: { type: string, nullable: true }
        task: { $ref: "#/components/schemas/IdName" }
        is_active: { type: boolean }
        billable:
          type: boolean
          description: Omitted without project-financials visibility.
        hourly_rate:
          type: number
          nullable: true
          description: Task rate on this project. Omitted without project-financials visibility.
        budget:
          type: number
          nullable: true
          description: Task budget on this project (hours, or fees when the project budgets by task fees). Omitted without project-budget visibility.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectTaskAssignmentCreate:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id: { type: string, description: An active workspace task (not a task that belongs to another project). }
        billable: { type: boolean, description: Defaults to the task's billable-by-default setting. }
        hourly_rate: { type: number, minimum: 0, maximum: 99999999.99, description: Defaults to the task's default rate. }
        budget: { type: number, minimum: 0, maximum: 99999999.99 }

    ProjectTaskAssignmentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        billable: { type: boolean }
        hourly_rate: { type: number, nullable: true, minimum: 0, maximum: 99999999.99 }
        budget: { type: number, nullable: true, minimum: 0, maximum: 99999999.99 }
        is_active: { type: boolean }

    ProjectTaskAssignmentRemoval:
      type: object
      required: [id, outcome, is_active]
      properties:
        id: { type: string }
        outcome: { type: string, enum: [archived, deleted] }
        is_active: { type: boolean, enum: [false] }

    # ── Users ──────────────────────────────────────────────────
    User:
      type: object
      properties:
        id: { type: string }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        email: { type: string }
        telephone: { type: string, nullable: true }
        timezone: { type: string }
        has_access_to_all_future_projects: { type: boolean }
        is_contractor: { type: boolean }
        is_active: { type: boolean }
        weekly_capacity: { type: integer, description: Seconds per week (e.g. 144000 = 40h) }
        default_hourly_rate:
          type: number
          nullable: true
          description: Omitted unless the caller has workspace billable-rate visibility.
        currency: { type: string }
        roles: { type: array, items: { type: string } }
        user_type:
          type: string
          enum: [human, agent]
        avatar_url: { type: string, nullable: true }
        company: { $ref: "#/components/schemas/CurrentUserCompany" }
        capabilities: { $ref: "#/components/schemas/UserCapabilities" }
        connection:
          type: object
          description: Present only for AI app connections (MCP connector tokens).
          properties:
            label: { type: string }
            workspace_bound: { type: boolean }
            calendar_data_excluded: { type: boolean, enum: [true] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CurrentUserCompany:
      type: object
      description: >-
        The workspace the credential is bound to, with the policy a time or
        expense client applies locally. Enum-like strings are lower-case.
      required:
        - id
        - name
        - currency
        - timezone
        - date_format
        - time_rounding
        - time_rounding_description
        - week_start_day
        - fiscal_year_end_month
        - manual_entry_format
        - require_notes
        - allow_past_timer_starts
        - allow_future_expense_dates
        - internal_time_notes_enabled
        - internal_time_notes_visibility
        - time_entry_notes_mode
        - time_billability_overrides_enabled
      properties:
        id: { type: string }
        name: { type: string }
        currency: { type: string, description: ISO 4217 workspace currency. }
        timezone: { type: string, description: IANA zone every date boundary is computed in. }
        date_format: { type: string, nullable: true, description: "The workspace's display date format, e.g. `DD/MM/YYYY`." }
        time_rounding:
          type: string
          description: Workspace rounding mode (lower-cased `TimeRounding`), e.g. `none`, `min_15`, `minimum_15`, `up_15`.
        time_rounding_description:
          type: string
          nullable: true
          description: >-
            The rounding rule in words, for report captions that explain why
            commercial hours differ from tracked time. Null when the workspace
            does not round (`time_rounding: none`).
        week_start_day:
          type: string
          enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
          description: First day of the workspace week, for week ranges in timesheets and reports.
        fiscal_year_end_month:
          type: integer
          minimum: 1
          maximum: 12
          description: Last month of the workspace's fiscal year (1 = January).
        manual_entry_format: { type: string, enum: [start_end, duration] }
        require_notes: { type: boolean }
        allow_past_timer_starts: { type: boolean }
        allow_future_expense_dates: { type: boolean }
        internal_time_notes_enabled: { type: boolean, description: False for external client memberships. }
        internal_time_notes_visibility: { type: string, description: Lower-cased `InternalTimeNotesVisibility`. }
        time_entry_notes_mode: { type: string, description: Lower-cased `TimeEntryNotesMode`. }
        time_billability_overrides_enabled: { type: boolean, description: False for external client memberships. }

    WorkspaceUser:
      type: object
      required: [id, email, is_active, is_contractor, weekly_capacity, currency, roles, access_roles, created_at]
      properties:
        id: { type: string }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        email: { type: string, format: email }
        employee_id: { type: string, nullable: true }
        is_active: { type: boolean }
        is_contractor: { type: boolean }
        weekly_capacity:
          type: integer
          description: Seconds per week from this workspace membership.
        currency:
          type: string
          description: ISO 4217 currency in which this person's cost rates are stored.
        roles:
          type: array
          items: { type: string }
          description: Active custom reporting-role names; these do not grant permissions.
        access_roles:
          type: array
          items: { type: string }
          description: Workspace permission roles used for authorization.
        created_at: { type: string, format: date-time }

    SyncWorkspaceUser:
      type: object
      required: [id, first_name, last_name, is_active, is_contractor, roles]
      description: Reduced personal read-only sync directory entry.
      properties:
        id: { type: string }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        is_active: { type: boolean }
        is_contractor: { type: boolean }
        roles:
          type: array
          items: { type: string }
          description: Permission roles retained in this reduced compatibility shape.

    Role:
      type: object
      required: [id, name, user_ids, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        user_ids:
          type: array
          items: { type: string }
          description: User CUIDs with an active assignment to this reporting role.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Teammate:
      type: object
      required: [id, first_name, last_name, email]
      properties:
        id: { type: string }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        email: { type: string, format: email }

    CostRate:
      type: object
      required: [id, amount, currency, start_date, end_date, created_at, updated_at]
      properties:
        id: { type: string }
        amount: { type: number, minimum: 0, maximum: 99999999.99, multipleOf: 0.01 }
        currency:
          type: string
          description: ISO 4217 member currency. Keito does not silently convert API cost-rate writes.
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CostRateCreate:
      type: object
      additionalProperties: false
      required: [amount, start_date]
      properties:
        amount: { type: number, minimum: 0, maximum: 99999999.99, multipleOf: 0.01 }
        start_date:
          type: string
          format: date
          description: Required effective date in YYYY-MM-DD format; future dates are supported.

    # ── Planning ────────────────────────────────────────────────
    PersonalPlanningAssignment:
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - project
        - task
        - start_date
        - end_date
        - daily_allocations
        - state
        - link
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
          readOnly: true
        project:
          type: object
          additionalProperties: false
          required:
            - id
            - name
            - code
          properties:
            id:
              type: string
            name:
              type: string
            code:
              type: string
              nullable: true
        task:
          type: object
          additionalProperties: false
          required:
            - id
            - name
          properties:
            id:
              type: string
            name:
              type: string
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        daily_allocations:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - date
              - hours
            properties:
              date:
                type: string
                format: date
              hours:
                type: number
        state:
          type: string
          enum:
            - CONFIRMED
            - TENTATIVE
        link:
          type: string
          nullable: true
          description: Workspace-relative Plan URL only when the caller can open Plan; otherwise null.

    PersonalPlanningAvailability:
      type: object
      additionalProperties: false
      required:
        - date
        - base_hours
        - available_hours
        - scheduled_hours
        - time_off_hours
        - is_public_holiday
        - over_allocated_hours
      properties:
        date:
          type: string
          format: date
        base_hours:
          type: number
        available_hours:
          type: number
        scheduled_hours:
          type: number
        time_off_hours:
          type: number
        is_public_holiday:
          type: boolean
        over_allocated_hours:
          type: number

    PersonalPlanningSchedule:
      type: object
      additionalProperties: false
      required:
        - person_id
        - workspace_timezone
        - week_start
        - range
        - snapshot_version
        - assignments
        - availability
        - capabilities
        - pagination
      properties:
        person_id:
          type: string
        workspace_timezone:
          type: string
        week_start:
          type: string
          enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
        range:
          type: object
          additionalProperties: false
          required:
            - from
            - to
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        snapshot_version:
          type: string
          pattern: ^ps1_[A-Za-z0-9_-]{43}$
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/PersonalPlanningAssignment"
        availability:
          type: array
          items:
            $ref: "#/components/schemas/PersonalPlanningAvailability"
        capabilities:
          type: object
          additionalProperties: false
          required:
            - own_read
            - manage_assignments
            - webhooks
          properties:
            own_read:
              type: boolean
            manage_assignments:
              type: boolean
            webhooks:
              type: boolean
        pagination:
          type: object
          additionalProperties: false
          required:
            - page
            - per_page
            - total_entries
            - total_pages
            - next_page
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total_entries:
              type: integer
            total_pages:
              type: integer
            next_page:
              type: integer
              nullable: true

    PlanningAssignmentItem:
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - project_id
        - task_id
        - user_id
        - placeholder_id
        - start_date
        - end_date
        - hours_per_day
        - allocation_mode
        - total_hours
        - status
        - notes
        - color
        - recurrence_series_id
        - deleted_at
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
          readOnly: true
        project_id:
          type: string
        task_id:
          type: string
          nullable: true
        user_id:
          type: string
          nullable: true
        placeholder_id:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        hours_per_day:
          type: number
        allocation_mode:
          type: string
          enum:
            - HOURS_PER_DAY
            - TOTAL_HOURS
        total_hours:
          type: number
          nullable: true
        status:
          type: string
          enum:
            - CONFIRMED
            - TENTATIVE
        notes:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        recurrence_series_id:
          type: string
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true

    PlanningWebhookEventV2:
      type: object
      additionalProperties: false
      required:
        - id
        - payload_version
        - event_type
        - entity_type
        - entity_id
        - revision
        - occurred_at
      properties:
        id:
          type: string
          description: Stable delivery identity across retries; deduplicate by this ID.
        payload_version:
          type: integer
          enum:
            - 2
        event_type:
          type: string
          enum:
            - assignment.created
            - assignment.updated
            - assignment.deleted
            - time_off.created
            - time_off.approved
            - time_off.rejected
            - time_off.cancelled
        entity_type:
          type: string
          enum:
            - planning_assignment
            - planning_time_off
        entity_id:
          type: string
        revision:
          type: integer
          minimum: 0
          description: Assignment revisions start at 1; time-off uses its existing zero-based version.
        occurred_at:
          type: string
          format: date-time

    PlanningAssignment:
      type: object
      properties:
        id:
          type: string
        project:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            code:
              type: string
              nullable: true
            status:
              type: string
              enum:
                - ACTIVE
                - TENTATIVE
                - ARCHIVED
            color:
              type: string
              nullable: true
            exclude_from_utilisation:
              type: boolean
            client:
              $ref: "#/components/schemas/IdName"
        task:
          type: object
          allOf:
            - $ref: "#/components/schemas/IdName"
          nullable: true
        user:
          type: object
          allOf:
            - $ref: "#/components/schemas/IdName"
          nullable: true
        placeholder:
          type: object
          allOf:
            - $ref: "#/components/schemas/PlanningPlaceholder"
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        hours_per_day:
          type: number
        allocation_mode:
          type: string
          enum:
            - HOURS_PER_DAY
            - TOTAL_HOURS
        total_hours:
          type: number
          nullable: true
        status:
          type: string
          enum:
            - CONFIRMED
            - TENTATIVE
        notes:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        recurrence_series_id:
          type: string
          nullable: true
          readOnly: true
          description: Shared by every occurrence of a weekly-repeat booking, so a series can be grouped; null for a one-off booking. Set by Keito and not writable through the API.
        planned_hours:
          type: number
        tracked_hours:
          type: number
        tracked_by_date:
          type: object
          additionalProperties:
            type: number
        tracked_ratio:
          type: number
        deleted_at:
          type: string
          format: date-time
          nullable: true
        revision:
          type: integer
          minimum: 1
          readOnly: true

    PlanningAssignmentCreate:
      type: object
      required:
        - project_id
        - start_date
        - end_date
        - hours_per_day
      properties:
        project_id:
          type: string
        task_id:
          type: string
          nullable: true
        user_id:
          type: string
          nullable: true
        placeholder_id:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        hours_per_day:
          type: number
          minimum: 0.25
          maximum: 24
        allocation_mode:
          type: string
          enum:
            - HOURS_PER_DAY
            - TOTAL_HOURS
          default: HOURS_PER_DAY
        total_hours:
          type: number
          nullable: true
          minimum: 0.25
          maximum: 10000
        status:
          type: string
          enum:
            - CONFIRMED
            - TENTATIVE
          default: CONFIRMED
        notes:
          type: string
          nullable: true
          maxLength: 5000
        color:
          type: string
          nullable: true
          maxLength: 30
      description: Exactly one of `user_id` or `placeholder_id` is required.
      additionalProperties: false

    PlanningAssignmentUpdate:
      type: object
      properties:
        project_id:
          type: string
        task_id:
          type: string
          nullable: true
        user_id:
          type: string
          nullable: true
        placeholder_id:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        hours_per_day:
          type: number
          minimum: 0.25
          maximum: 24
        allocation_mode:
          type: string
          enum:
            - HOURS_PER_DAY
            - TOTAL_HOURS
        total_hours:
          type: number
          nullable: true
          minimum: 0.25
          maximum: 10000
        status:
          type: string
          enum:
            - CONFIRMED
            - TENTATIVE
        notes:
          type: string
          nullable: true
          maxLength: 5000
        color:
          type: string
          nullable: true
          maxLength: 30
      description: All fields are optional; if either assignee field is supplied exactly one assignee must be non-null.
      additionalProperties: false

    PlanningPlaceholder:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          nullable: true
        weekly_capacity:
          type: integer
          description: Seconds per week

    PlanningTimeOff:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        hours_per_day:
          type: number
          nullable: true
        type:
          type: string
          enum:
            - ANNUAL_LEAVE
            - SICK
            - PUBLIC_HOLIDAY
            - PARENTAL
            - OTHER
        time_off_type_id:
          type: string
          nullable: true
          description: Stable workspace catalogue ID for native bookings
        type_name:
          type: string
          description: Current catalogue label, or the legacy enum label for external/system rows
        counts_against_allowance:
          type: boolean
          description: Booking-time allowance snapshot
        approval_status:
          type: string
          enum:
            - PENDING
            - APPROVED
            - REJECTED
        notes:
          type: string
          nullable: true
        source:
          type: string
          enum:
            - MANUAL
            - CHARLIE_HR
        external_id:
          type: string
          nullable: true

    PlanningCapacity:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        date:
          type: string
          format: date
        available_hours:
          type: number
        scheduled_hours:
          type: number
        time_off_hours:
          type: number
        utilisation:
          type: number
        over_allocated_hours:
          type: number
        is_public_holiday:
          type: boolean

    WebhookEndpoint:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - assignment.created
              - assignment.updated
              - assignment.deleted
              - time_off.created
              - time_off.approved
              - time_off.rejected
              - time_off.cancelled
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        payload_version:
          type: integer
          enum:
            - 1
            - 2
          default: 1
          description: Opt in to minimal signed v2 events. Version 1 preserves existing payloads.

    WebhookEndpointCreate:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        name:
          type: string
          nullable: true
          maxLength: 120
        secret:
          type: string
          nullable: true
          minLength: 16
          description: At least 16 characters; required for payload_version=2. HMAC-SHA256 signs timestamp + "." + raw body in X-Keito-Webhook-Signature; timestamp is X-Keito-Webhook-Timestamp.
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - assignment.created
              - assignment.updated
              - assignment.deleted
              - time_off.created
              - time_off.approved
              - time_off.rejected
              - time_off.cancelled
        payload_version:
          type: integer
          enum:
            - 1
            - 2
          default: 1
          description: Opt in to minimal signed v2 events. Version 1 preserves existing payloads.

    Invoice:
      type: object
      properties:
        id: { type: string }
        client_id: { type: string }
        created_by_id: { type: string }
        owner_id: { type: string, nullable: true }
        owner: { $ref: "#/components/schemas/RecordOwner" }
        client: { $ref: "#/components/schemas/IdName" }
        creator:
          type: object
          properties:
            id: { type: string }
            name: { type: string, nullable: true }
            email: { type: string }
        number: { type: string }
        purchase_order: { type: string, nullable: true }
        subject: { type: string, nullable: true }
        state:
          type: string
          enum: [draft, open, paid, closed, voided]
        is_overdue:
          type: boolean
          description: >-
            Open, with a balance due, and past its due date in the workspace
            timezone. Present on list and detail responses.
        amount: { type: number }
        due_amount: { type: number }
        credit_correction:
          type: object
          nullable: true
          description: >-
            Separate verified credit and bank-refund economics. The original amount,
            due_amount and state retain their existing document meanings. Null when
            there is no correction. Review-required balances are not reusable credit.
            These fields do not initiate money movement.
          properties:
            status: { type: string, enum: [active, review_required] }
            credited_amount: { type: number }
            credited_tax_amount: { type: number }
            credited_tax2_amount: { type: number }
            net_invoiced_amount: { type: number }
            customer_credit_amount: { type: number }
            cash_refunded_amount: { type: number }
            pending_refund_amount: { type: number }
            accounting_refund_amount: { type: number }
            credit_date: { type: string, format: date }
            last_verified_at: { type: string, format: date-time }
        tax: { type: number, nullable: true }
        tax_amount: { type: number, nullable: true }
        tax2: { type: number, nullable: true }
        tax2_amount: { type: number, nullable: true }
        discount: { type: number, nullable: true }
        discount_amount: { type: number, nullable: true }
        currency: { type: string }
        issue_date: { type: string, format: date }
        due_date: { type: string, format: date }
        payment_term:
          type: string
          enum: [upon_receipt, net_15, net_30, net_45, net_60, custom]
        notes: { type: string, nullable: true }
        period_start: { type: string, format: date, nullable: true }
        period_end: { type: string, format: date, nullable: true }
        service_period_start: { type: string, format: date, nullable: true }
        service_period_end: { type: string, format: date, nullable: true }
        sent_at: { type: string, format: date-time, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        payments_count:
          type: integer
          description: Number of payments recorded against the invoice. Present on list and detail responses.
        last_payment_at:
          type: string
          format: date-time
          nullable: true
          description: When the most recent payment was made, or null. Present on list and detail responses.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        line_items:
          type: array
          description: Omitted from the list when `include_line_items=false`.
          items:
            $ref: "#/components/schemas/LineItem"

    InvoiceCreate:
      type: object
      additionalProperties: false
      required: [client_id]
      properties:
        client_id: { type: string }
        owner_id:
          type: string
          description: Eligible workspace member ID. Defaults to the authenticated caller.
        number:
          type: string
          description: Optional custom invoice number. Must be unique in the workspace.
        subject: { type: string }
        issue_date: { type: string, format: date, description: Defaults to today. }
        due_date: { type: string, format: date }
        payment_term:
          type: string
          enum: [upon_receipt, net_15, net_30, net_45, net_60, custom]
          default: net_30
        currency: { type: string }
        purchase_order: { type: string }
        tax: { type: number }
        tax2: { type: number }
        discount: { type: number }
        notes: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        service_period_start: { type: string, format: date }
        service_period_end: { type: string, format: date }
        line_items:
          description: >-
            Explicit line items. Mutually exclusive with `line_items_import`.
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              kind: { type: string, default: Service }
              description: { type: string }
              quantity: { type: number, default: 1, minimum: 0 }
              unit_price: { type: number, default: 0, minimum: 0 }
              effect:
                type: string
                enum: [charge, credit]
                default: charge
                description: >-
                  Use `credit` for credit lines. `quantity` and `unit_price` must
                  stay non-negative.
              taxed:
                type: boolean
                description: Defaults to true when the effective invoice tax rate is non-zero.
              taxed2:
                type: boolean
                description: Defaults to true when the effective secondary tax rate is non-zero.
              project_id:
                type: string
                description: >-
                  Project the line bills. Must belong to the invoice's client (and so to the
                  caller's workspace); otherwise the request is refused with 404 and nothing is
                  created.
              sort_order: { type: integer }
        line_items_import:
          $ref: "#/components/schemas/InvoiceLineItemsImport"

    InvoiceLineItemsImport:
      type: object
      additionalProperties: false
      description: >-
        Build the invoice's line items from tracked time and expenses instead of
        supplying them explicitly. Only billable, not-yet-invoiced work is
        included, and the workspace's approval policy decides whether unapproved
        work is eligible. Imported lines are taxable when the effective invoice
        tax rate is non-zero. Imported time entries and expenses are marked as billed.
        Mutually exclusive with `line_items`; at least one of `time` or `expenses`
        is required.
      properties:
        project_ids:
          type: array
          description: Restrict the import to these projects. Omit for all of the client's projects.
          items: { type: string }
        time:
          type: object
          additionalProperties: false
          required: [summary_type]
          properties:
            summary_type:
              type: string
              enum: [project, task, people, detailed]
              description: >-
                How imported time is grouped into line items. `detailed` creates
                one line per time entry.
            include_notes:
              type: boolean
              default: false
              description: >-
                For grouped time-entry imports (`project`, `task`, or `people`),
                append each client-facing note as bullet lines. Blank notes are
                skipped and repeated notes are retained. Internal notes are never
                included. Keito renders these using existing invoice-description
                formatting, with HTML-looking content displayed as text. Ignored for
                `detailed`, which already includes each entry's note in its own line.
            user_ids:
              type: array
              description: >-
                Restrict the time import to entries owned by these workspace users.
                Omit to include all owners; an empty array imports no time entries.
                Repeated IDs are treated as one owner.
              items: { type: string }
            from:
              type: string
              format: date
              description: Defaults to the earliest uninvoiced entry.
            to:
              type: string
              format: date
              description: Defaults to the latest uninvoiced entry.
        expenses:
          type: object
          additionalProperties: false
          required: [summary_type]
          properties:
            summary_type:
              type: string
              enum: [project, category, people, detailed]
            user_ids:
              type: array
              description: >-
                Restrict the expense import to entries owned by these workspace users.
                Omit to include all owners; an empty array imports no expenses.
                Repeated IDs are treated as one owner.
              items: { type: string }
            from: { type: string, format: date }
            to: { type: string, format: date }

    InvoiceUpdate:
      type: object
      additionalProperties: false
      properties:
        owner_id:
          type: string
          nullable: true
          description: Eligible workspace member ID. Omit to leave unchanged; null clears the owner.
        number:
          type: string
          description: A unique invoice number for this workspace.
        subject: { type: string }
        issue_date: { type: string, format: date }
        due_date: { type: string, format: date }
        purchase_order: { type: string }
        tax: { type: number }
        tax2: { type: number }
        discount: { type: number }
        notes: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        service_period_start: { type: string, format: date, nullable: true }
        service_period_end: { type: string, format: date, nullable: true }
        line_items:
          type: array
          minItems: 1
          description: >-
            Patch existing draft line items in place. Every object must include
            the line item `id`; replacement arrays and new line items are not
            accepted. Editing imported lines preserves the billed state of the
            source time entries and expenses.
          items:
            $ref: "#/components/schemas/InvoiceLineItemUpdate"

    InvoiceLineItemUpdate:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string }
        kind: { type: string, minLength: 1, maxLength: 255 }
        effect: { type: string, enum: [charge, credit] }
        description: { type: string, maxLength: 65535 }
        quantity: { type: number, minimum: 0 }
        unit_price: { type: number, minimum: 0 }
        taxed: { type: boolean }
        taxed2: { type: boolean }

    # ── Estimates ──────────────────────────────────────────────
    Estimate:
      type: object
      properties:
        id: { type: string }
        company_id: { type: string }
        client_id: { type: string }
        created_by_id: { type: string }
        owner_id: { type: string, nullable: true }
        owner: { $ref: "#/components/schemas/RecordOwner" }
        client: { $ref: "#/components/schemas/IdName" }
        number: { type: string }
        purchase_order: { type: string, nullable: true }
        subject: { type: string, nullable: true }
        state:
          type: string
          enum: [draft, sent, viewed, accepted, declined, expired]
        amount: { type: number }
        tax: { type: number, nullable: true }
        tax_amount: { type: number, nullable: true }
        tax2: { type: number, nullable: true }
        tax2_amount: { type: number, nullable: true }
        discount: { type: number, nullable: true }
        discount_amount: { type: number, nullable: true }
        currency: { type: string }
        issue_date: { type: string, format: date }
        valid_until: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        intro_message: { type: string, nullable: true }
        sent_at: { type: string, format: date-time, nullable: true }
        viewed_at: { type: string, format: date-time, nullable: true }
        accepted_at: { type: string, format: date-time, nullable: true }
        declined_at: { type: string, format: date-time, nullable: true }
        expired_at: { type: string, format: date-time, nullable: true }
        accepted_by_name: { type: string, nullable: true }
        decline_reason: { type: string, nullable: true }
        converted_invoice_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"

    EstimateCreate:
      type: object
      required: [client_id]
      properties:
        client_id: { type: string }
        owner_id:
          type: string
          nullable: true
          description: Eligible workspace member ID. Defaults to the authenticated caller.
        number: { type: string }
        subject: { type: string }
        issue_date: { type: string, format: date }
        valid_until: { type: string, format: date, nullable: true }
        currency: { type: string }
        purchase_order: { type: string }
        tax: { type: number }
        tax2: { type: number }
        discount: { type: number }
        notes: { type: string }
        intro_message: { type: string }
        line_items:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, default: SERVICE }
              description: { type: string }
              quantity: { type: number, default: 1 }
              unit_price: { type: number, default: 0 }
              taxed: { type: boolean, default: false }
              taxed2: { type: boolean, default: false }
              project_id:
                type: string
                nullable: true
                description: >-
                  Project the line refers to. Must belong to the estimate's client (and so to
                  the caller's workspace); otherwise the request is refused with 404.

    EstimateUpdate:
      allOf:
        - $ref: "#/components/schemas/EstimateCreate"

    RecordOwner:
      type: object
      nullable: true
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        email: { type: string, format: email }

    LineItem:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        effect: { type: string, enum: [charge, credit] }
        description: { type: string, nullable: true }
        quantity: { type: number }
        unit_price: { type: number }
        amount: { type: number }
        taxed: { type: boolean }
        taxed2: { type: boolean }
        project_id: { type: string, nullable: true }
        sort_order: { type: integer }

    # ── Invoice Messages ───────────────────────────────────────
    InvoiceAttachment:
      type: object
      properties:
        id: { type: string }
        invoice_id: { type: string }
        file_name: { type: string }
        file_size: { type: integer, description: Size in bytes }
        content_type: { type: string }
        kind:
          type: string
          enum: [upload, time_report]
          description: >-
            `upload` for files added by a person, `time_report` for the Excel
            time report Keito generated from the time billed on the invoice.
        uploaded_by_id: { type: string }
        download_url: { type: string }
        uploaded_by:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string, nullable: true }
            email: { type: string, format: email }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InvoiceMessage:
      type: object
      properties:
        id: { type: string }
        invoice_id: { type: string }
        sent_by: { type: string, nullable: true }
        sent_by_email: { type: string, nullable: true }
        sent_from: { type: string, nullable: true }
        sent_from_email: { type: string, nullable: true }
        recipients: {}
        cc_recipients:
          type: array
          items:
            type: object
            required: [email]
            properties:
              name: { type: string }
              email: { type: string, format: email }
        subject: { type: string, nullable: true }
        body: { type: string, nullable: true }
        attach_pdf: { type: boolean }
        attach_expense_receipts: { type: boolean }
        attach_files:
          type: boolean
          description: Whether uploaded invoice attachments (and generated time reports) were included in the email.
        send_me_a_copy: { type: boolean }
        thank_you: { type: boolean }
        reminder: { type: boolean }
        event_type: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InvoiceMessageCreate:
      type: object
      description: >-
        `recipients` is required for email events and omitted for `mark_sent`.
      properties:
        recipients:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [email]
            properties:
              name: { type: string }
              email: { type: string, format: email }
        cc_recipients:
          type: array
          default: []
          maxItems: 50
          description: Optional CC recipients. The combined recipients and cc_recipients limit is 50.
          items:
            type: object
            required: [email]
            properties:
              name: { type: string }
              email: { type: string, format: email }
        attach_expense_receipts:
          type: boolean
          default: true
          description: Include expense receipts selected when the invoiced expenses were recorded.
        expense_receipt_delivery:
          type: string
          enum: [separate, combined_pdf]
          default: separate
          description: Send selected expense receipts as separate original files or as one combined PDF. Combined PDF supports PDF, JPEG, and PNG receipts.
        subject: { type: string, maxLength: 500 }
        body: { type: string, maxLength: 20000 }
        attach_pdf: { type: boolean, default: true }
        send_me_a_copy: { type: boolean, default: false }
        include_attachments:
          type: boolean
          default: true
          description: Include the invoice's uploaded files and generated time report as email attachments. The invoice PDF, receipts and files must fit within the 9 MB email limit.
        event_type:
          type: string
          enum: [send, mark_sent, resend, reminder, thank_you]
          default: send
        confirm:
          $ref: "#/components/schemas/InvoiceConfirmation"

    InvoiceConfirmation:
      type: object
      additionalProperties: false
      required: [amount, currency]
      description: >-
        What the caller believes is about to be issued. Compared with the
        invoice before any state change; a mismatch is a 409 `confirmation_mismatch`.
      properties:
        amount:
          oneOf:
            - { type: number }
            - { type: string, pattern: '^-?\\d+(\\.\\d+)?$' }
          description: Invoice total, compared at two decimal places.
        currency: { type: string, minLength: 3, maxLength: 3, example: GBP }
        recipient_count:
          type: integer
          minimum: 0
          description: Number of distinct To recipients after de-duplication; 0 for `mark_sent`.

    InvoicePaymentDeletion:
      type: object
      required: [id, invoice_id, deleted, outcome, accounting_sync]
      properties:
        id: { type: string }
        invoice_id: { type: string }
        deleted:
          type: boolean
          description: True when the payment is gone from Keito.
        outcome:
          type: string
          enum: [deleted, kept_in_keito]
        accounting_sync:
          type: object
          required: [provider, status]
          properties:
            provider: { type: string, enum: [XERO, QUICKBOOKS] }
            status: { type: string, enum: [SYNCED, PENDING, NEEDS_ATTENTION, NOT_APPLICABLE] }
            message: { type: string }
        message:
          type: string
          description: Only when `outcome` is `kept_in_keito`; why the payment was not removed.

    InvoicePaymentCreate:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount: { type: number, minimum: 0.01, maximum: 99999999.99 }
        paid_at:
          type: string
          format: date-time
          description: Defaults to the current time.
        notes: { type: string, maxLength: 65535 }
        transaction_id: { type: string, minLength: 1, maxLength: 255 }
        payment_gateway: { type: string, minLength: 1, maxLength: 255 }
        send_thank_you:
          type: boolean
          description: Overrides the workspace's automatic thank-you preference for this payment.

    InvoicePayment:
      type: object
      properties:
        id: { type: string }
        invoice_id: { type: string }
        amount: { type: number }
        paid_at: { type: string, format: date-time }
        paid_date: { type: string, format: date }
        recorded_by: { type: string, nullable: true }
        recorded_by_email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        transaction_id: { type: string, nullable: true }
        payment_gateway_id: { type: string, nullable: true }
        payment_gateway: { type: string, nullable: true }
        origin:
          type: string
          enum: [manual, stripe, paypal, retainer, xero, quickbooks, harvest_import, legacy]
        deletable:
          type: boolean
          description: >-
            Only on `GET /api/v2/invoices/{id}/payments`. True when the payment
            was recorded manually and the caller may manage invoices.
        accounting_sync: { type: object }
        thank_you: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── Reports ────────────────────────────────────────────────
    HarvestReportPaginationEnvelope:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          required: [next_page, previous_page]
          properties:
            next_page: { type: integer, nullable: true }
            previous_page: { type: integer, nullable: true }

    ProjectBudgetReportResult:
      type: object
      required: [project_id, project_name, client_id, client_name, budget_is_monthly, budget_by, is_active, budget, budget_spent, budget_remaining]
      properties:
        project_id: { type: string }
        project_name: { type: string }
        client_id: { type: string }
        client_name: { type: string }
        budget_is_monthly: { type: boolean }
        budget_by:
          type: string
          enum: [project, project_hours, project_cost, task, task_fees, person]
        is_active: { type: boolean }
        budget: { type: number }
        budget_spent: { type: number }
        budget_remaining: { type: number }

    AmountByCurrency:
      type: object
      required: [currency, amount]
      properties:
        currency: { type: string, example: GBP }
        amount: { type: number, example: 275 }

    RateByCurrency:
      type: object
      required: [currency, rate]
      properties:
        currency: { type: string, example: GBP }
        rate: { type: number, example: 100, description: Weighted effective billable rate per hour. }

    TimeReportRow:
      type: object
      description: |
        One row of a member-facing time report. Hours are decimal hours to two
        places, rounded per entry by the workspace rule. The amount and rate
        fields are present only when the caller may view billable rates.
      required: [id, name, total_hours, billable_hours, non_billable_hours, fixed_fee_hours]
      properties:
        id: { type: string }
        name: { type: string }
        total_hours: { type: number }
        billable_hours: { type: number }
        non_billable_hours: { type: number }
        fixed_fee_hours: { type: number, description: Hours on fixed-fee projects (a subset of total_hours). }
        currency:
          type: string
          nullable: true
          description: The one currency every amount on the row is in; null when the row mixes currencies or has nothing billable.
        billable_amount:
          type: number
          nullable: true
          description: The billable amount in `currency`; null when the row mixes currencies.
        rate:
          type: number
          nullable: true
          description: The weighted effective rate in `currency`; null when mixed or nothing is billable.
        billable_amounts:
          type: array
          items: { $ref: "#/components/schemas/AmountByCurrency" }
        rates:
          type: array
          items: { $ref: "#/components/schemas/RateByCurrency" }

    TimeReportProjectRow:
      allOf:
        - $ref: "#/components/schemas/TimeReportRow"
        - type: object
          required: [client_id, client_name, code, is_fixed_fee]
          properties:
            client_id: { type: string }
            client_name: { type: string }
            code: { type: string, nullable: true }
            is_fixed_fee: { type: boolean }

    TimeReportTaskRow:
      allOf:
        - $ref: "#/components/schemas/TimeReportRow"
        - type: object
          required: [percent_of_total]
          properties:
            percent_of_total: { type: number, description: "This task's share of the report's hours, in percent." }

    TimeReportSummary:
      type: object
      description: Totals over every row of the report, before paging.
      required: [total_hours, billable_hours, non_billable_hours, fixed_fee_hours, billable_percent, amounts_visible, rounding]
      properties:
        total_hours: { type: number }
        billable_hours: { type: number }
        non_billable_hours: { type: number }
        fixed_fee_hours: { type: number }
        billable_percent: { type: number, description: Billable hours as a percentage of total hours; 0 for an empty report. }
        amounts_visible:
          type: boolean
          description: False when the caller may not view billable rates; every amount and rate is then omitted from the rows and this summary.
        billable_amounts:
          type: array
          description: Present only when `amounts_visible` is true.
          items: { $ref: "#/components/schemas/AmountByCurrency" }
        rounding:
          type: object
          required: [mode, description]
          properties:
            mode: { type: string, example: min_15, description: "The workspace time-rounding setting, lower-cased." }
            description:
              type: string
              nullable: true
              example: rounded to the nearest 15 minutes
              description: Human-readable rounding rule; null when the workspace does not round.

    ProjectBillingSummary:
      type: object
      required: [project, period, invoiced, invoices_by_state, uninvoiced, budget, calendar_time_excluded, includes_unapproved_billable_work]
      properties:
        project:
          type: object
          required: [id, name, code, client, currency, is_fixed_fee, is_active]
          properties:
            id: { type: string }
            name: { type: string }
            code: { type: string, nullable: true }
            client: { $ref: "#/components/schemas/IdName" }
            currency: { type: string, example: GBP, description: The client's currency; every amount outside `by_currency` is in it. }
            is_fixed_fee: { type: boolean }
            is_active: { type: boolean }
        period:
          type: object
          nullable: true
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        invoiced:
          type: object
          required: [amount, currency, by_currency, draft_amount]
          properties:
            amount:
              type: number
              description: Issued (open, paid, closed) invoice line amounts for this project in the project currency.
            currency: { type: string }
            by_currency:
              type: array
              description: Issued amounts per invoice currency; never summed across currencies.
              items:
                type: object
                required: [currency, amount]
                properties:
                  currency: { type: string }
                  amount: { type: number }
            draft_amount:
              type: number
              description: Draft invoice line amounts for this project in the project currency; not part of `amount`.
        invoices_by_state:
          type: object
          required: [draft, open, paid, closed, voided]
          properties:
            draft: { type: integer }
            open: { type: integer }
            paid: { type: integer }
            closed: { type: integer }
            voided: { type: integer }
        uninvoiced:
          type: object
          required: [hours, time_amount, expense_amount, amount, currency]
          properties:
            hours: { type: number, description: Unbilled billable hours (workspace rounding). }
            time_amount: { type: number }
            expense_amount: { type: number }
            amount: { type: number, description: Unbilled time or fixed-fee balance plus unbilled expenses. }
            currency: { type: string }
        budget:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ProjectBudgetReportResult"
        calendar_time_excluded:
          type: boolean
          description: True when calendar-derived time was left out of the uninvoiced figures (always true for AI app connections).
        includes_unapproved_billable_work:
          type: boolean

    UninvoicedReportResult:
      type: object
      required: [client_id, client_name, project_id, project_name, currency, total_hours, uninvoiced_hours, uninvoiced_expenses, uninvoiced_amount]
      properties:
        client_id: { type: string }
        client_name: { type: string }
        project_id: { type: string }
        project_name: { type: string }
        currency: { type: string, example: GBP }
        total_hours:
          type: number
          description: Billable hours in the selected period that satisfy the workspace approval policy.
        uninvoiced_hours:
          type: number
          description: Unbilled billable hours in the selected period.
        uninvoiced_expenses:
          type: number
          description: Unbilled billable expense amount in the selected period.
        uninvoiced_amount:
          type: number
          description: Unbilled time or fixed-fee balance plus unbilled expenses.

    TeamTimeResult:
      type: object
      properties:
        user_id: { type: string }
        user_name: { type: string }
        is_contractor: { type: boolean }
        weekly_capacity: { type: integer, description: Seconds per week }
        avatar_url: { type: string, nullable: true }
        total_hours:
          type: number
          description: >-
            Hours rounded per the workspace time-rounding setting
            (Harvest-compatible). Equals actual_hours when rounding is off.
        billable_hours:
          type: number
          description: >-
            Billable hours rounded per the workspace time-rounding setting
            (Harvest-compatible).
        currency: { type: string }
        billable_amount:
          type: number
          description: Rounded billable hours multiplied by the billable rate.
        actual_hours:
          type: number
          description: >-
            Keito extension. Actual unrounded hours for payroll and
            accountability consumers; additive so Harvest-compatible clients
            are unaffected.
