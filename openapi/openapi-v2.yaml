openapi: 3.0.3
info:
  title: Keito API v2
  description: |
    Harvest-compatible REST API for time tracking, expenses, projects, invoicing, and reporting.

    ## Authentication

    Two methods are supported:

    1. **API Key** — `Authorization: Bearer kto_...` + `Keito-Account-Id: <company_cuid>` header
    2. **WorkOS JWT** — `Authorization: Bearer <jwt>` (company resolved from token claims)

    ## Billable-rate visibility

    Billable-rate properties are optional and are omitted unless the caller is an
    owner/admin, a manager with `canViewBillableRates`, or (for a specific project)
    an active assignee with `canViewProjectFinancials`. Project-scoped viewers only
    receive rates for their permitted projects. Project-manager status alone does
    not grant rate visibility. Internal `cost_rate` values are never serialized by
    these tracking/read endpoints.

    `GET /api/v2/tasks?project_id=...` returns the authenticated user's current
    `effective_billable_rate` for each project/task option when authorized. Historical
    time entries return their stored `billable_rate`; it is never replaced with the
    current configured rate.

    All responses include `X-Keito-API-Version: 2`.

    ## Team role compatibility migration

    The administrator workspace directory follows Harvest's separation between
    descriptive reporting roles and permission roles. In `GET /api/v2/users`,
    `roles` now contains active custom reporting-role names and `access_roles`
    contains Keito permission roles. Existing consumers must migrate permission checks from `roles` to `access_roles`.
    Workspace-scoped capacity is returned as `weekly_capacity` in seconds.

    Personal read-only sync keys keep their intentionally reduced user shape:
    they do not receive email, capacity, custom reporting roles, or teammate
    relationships. Their existing `roles` property remains the reduced
    permission-role representation for backward compatibility.

    ## Scoped API keys

    New API keys can be created with full account access or the least-privilege
    ClickUp mapping automation (`clickup:mappings:read` and `clickup:mappings:write`) or the
    cost-rate automation scope set (`users:read`, `cost_rates:read`, and
    `cost_rates:write`). Legacy keys and configurations without versioned scope
    enforcement retain their existing full-access behavior. Cost-rate routes
    additionally require the authenticated key owner to be a workspace owner or
    administrator.
  version: "2.0"
  contact:
    name: Keito Support

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://app.keito.ai
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Time Entries
  - name: External References
  - name: Timesheet Approvals
  - name: Expenses
  - name: Projects
  - name: Project Assignments
  - name: Clients
  - name: Contacts
  - name: ClickUp
  - name: Tasks
  - name: Users
  - name: Roles
  - name: Invoices
  - name: Estimates
  - name: Retainers
  - name: Invoice Messages
  - name: Reports
  - name: Planning
  - name: Webhooks
  - name: Backup

paths:
  /api/v2/expenses/{id}/reimbursement:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Expense CUID in the authenticated workspace.
    get:
      tags: [Expenses]
      operationId: getExpenseReimbursementClassification
      summary: Get an expense reimbursement classification
      security:
        - bearerAuth: []
      description: |
        Returns only the three-state classification and its version. Reimbursable
        is true or false; null means Not classified. Requires the same administrator
        or expense-owner access as the expense API and current reimbursement read
        authority. Authorized historical classification remains readable after the
        reimbursement workflow is disabled. Limited sync credentials and AI-app
        connections do not gain access to this endpoint.
      responses:
        "200":
          description: Expense reimbursement classification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseReimbursementClassification"
        "401": { description: Authentication required. }
        "403": { description: Expense feature or current access is unavailable. }
        "404": { description: Expense not found in the authenticated workspace. }
        "409": { description: Authenticated workspace binding does not match. }
    patch:
      tags: [Expenses]
      operationId: classifyExpenseReimbursement
      summary: Classify an expense for reimbursement
      security:
        - bearerAuth: []
      description: |
        Changes only reimbursable classification using the current expense_version
        returned by GET. Explicit null restores Not classified; omission is invalid.
        Reuses the opted-in Pro/Business workflow, expense editing authority and
        archive, invoice, import, timesheet and repayment-history protections.
        A successful classification returns the expense to Unsubmitted for review.
        Client billability is unchanged. This records no repayment, creates no
        consultant invoice and moves no money. Existing expense create/update
        payloads and response shapes are unchanged. Full-access API v2 credential
        admission is unchanged; limited sync credentials and AI-app connections
        do not gain access.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 8, maxLength: 255, pattern: "^[A-Za-z0-9._-]+$" }
          description: Retry an identical request with this key; a changed payload or authority conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseReimbursementClassificationUpdate"
            example:
              reimbursable: false
              expected_expense_version: 3
      responses:
        "200":
          description: Saved classification and its new expense version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseReimbursementClassification"
        "400": { description: "Invalid JSON, missing version or classification, or an unsupported field." }
        "401": { description: Authentication required. }
        "403": { description: "Expense feature, reimbursement opt-in, plan or current authority is unavailable." }
        "404": { description: Expense not found in the authenticated workspace. }
        "409": { description: "Stale version, protected expense or repayment history, or idempotency/workspace conflict." }
  /api/v2/clickup/locations:
    get:
      tags: [ClickUp]
      summary: Discover locations through the authenticated user's ClickUp grant
      operationId: listClickUpLocations
      description: |
        Requires clickup:mappings:read, active internal membership and either
        administrator access or explicit canManageClickUpMappings delegation.
        Discovery uses the caller's own connection to the selected Workspace.
        With no parameters returns Spaces with Time Tracking enabled. space_id
        adds Folders and folderless Lists; folder_id selects Lists in that Folder.
        Repeated or unknown query parameters are rejected.
      parameters:
        - { name: space_id, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: folder_id, in: query, description: Requires space_id, schema: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        "200": { description: "Object containing spaces, folders and lists arrays" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v2/clickup/mappings:
    get:
      tags: [ClickUp]
      summary: List mappings within the authenticated user's permitted projects
      operationId: listClickUpMappings
      description: Requires clickup:mappings:read and current mapping permission. Includes disabled mappings to retain historical identities.
      responses:
        "200": { description: Object containing a mappings array; each mapping includes its version and minimal project/task labels }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [ClickUp]
      summary: Idempotently create or replace a versioned mapping
      operationId: upsertClickUpMapping
      description: |
        Requires clickup:mappings:write and current mapping permission. Managers
        must manage both the previous and new project. A required active Keito
        task must belong to or be assigned to the project. Provider hierarchy is
        verified through the caller's own ClickUp connection; labels are fetched
        from ClickUp. Manual mappings win over automatic mappings, with List >
        Folder > Space precedence. Disabled/archived overrides prevent fallback.
        expectedVersion=0 creates a mapping; replacing requires its current
        version. A stale version returns 409. Reuse the exact Idempotency-Key and
        body to recover an uncertain result. Fresh grant/target authorization is
        checked before a stored response can replay. No projects are created.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [locationType, clickUpSpaceId, projectId, taskId, expectedVersion]
              properties:
                locationType: { type: string, enum: [SPACE, FOLDER, LIST] }
                clickUpSpaceId: { type: string, minLength: 1, maxLength: 100 }
                clickUpFolderId: { type: string, nullable: true, maxLength: 100, description: Required for FOLDER }
                clickUpListId: { type: string, nullable: true, maxLength: 100, description: Required for LIST }
                clickUpSpaceName: { type: string, nullable: true, maxLength: 500 }
                clickUpFolderName: { type: string, nullable: true, maxLength: 500 }
                clickUpListName: { type: string, nullable: true, maxLength: 500 }
                projectId: { type: string, description: Keito project CUID }
                taskId: { type: string, description: Required Keito task CUID }
                billableOverride: { type: boolean, nullable: true, description: Null inherits Keito policy }
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        "200": { description: Saved mapping with incremented version }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ─── TIME ENTRIES ──────────────────────────────────────────────
  /api/v2/time_entries:
    get:
      tags: [Time Entries]
      summary: List time entries
      operationId: listTimeEntries
      description: Stored `billable_rate` is included only when authorized for the entry's project. Internal cost rates are never returned. Personal read-only sync responses include a minimal `task_assignment` (`id`, `billable`, `is_active`) but omit its rates, budgets, and totals.
      parameters:
        - $ref: "#/components/parameters/exclude_calendar"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: user_id
          in: query
          schema: { type: string }
          description: Filter by user CUID
        - name: client_id
          in: query
          schema: { type: string }
        - name: project_id
          in: query
          schema: { type: string }
        - name: task_id
          in: query
          schema: { type: string }
        - name: task
          in: query
          schema: { type: string }
          description: Alias for task_id. When both are supplied their values must match.
        - name: is_billed
          in: query
          schema: { type: boolean }
        - name: invoice_id
          in: query
          schema: { type: string, minLength: 1, maxLength: 191 }
          description: Filter by a Keito invoice CUID linked directly or through a grouped invoice line. Combined with other filters before pagination. Blank, conflicting repeated, or internally whitespace-containing values return 400. Unknown invoices or invoices outside the current workspace return an empty list. Not available to personal read-only sync keys.
        - name: is_running
          in: query
          schema: { type: boolean }
        - name: approval_status
          in: query
          schema: { type: string, enum: [unsubmitted, submitted, approved, rejected] }
          description: Filter by Keito approval state. Not available to personal read-only sync keys.
        - name: from
          in: query
          schema: { type: string, format: date }
          description: Start date (YYYY-MM-DD)
        - name: to
          in: query
          schema: { type: string, format: date }
          description: End date (YYYY-MM-DD)
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
        - name: source
          in: query
          schema: { type: string, enum: [web, cli, api, agent, calendar, desktop, mobile, integration, extension] }
          description: Filter by entry source. Comma-separated for multiple (e.g. `agent,cli`).
        - name: external_reference_id
          in: query
          schema: { type: string }
          description: External object identifier. Must be used with `external_reference_service`.
        - name: external_reference_service
          in: query
          schema: { type: string }
          description: External service identifier such as `zendesk.com`. Must be used with `external_reference_id`.
        - name: external_reference_group_id
          in: query
          schema: { type: string }
          description: Optional external group or scope identifier.
        - name: external_reference_account_id
          in: query
          schema: { type: string }
          description: Optional external account identifier.
      responses:
        "200":
          description: Paginated list of time entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      time_entries:
                        type: array
                        items:
                          $ref: "#/components/schemas/TimeEntry"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/WorkspaceMismatch" }

    post:
      tags: [Time Entries]
      summary: Create a time entry
      operationId: createTimeEntry
      description: |
        Supports `Idempotency-Key` for safe retries: the same key with the same body
        replays the stored response (`Idempotency-Replayed: true`) for 24 hours;
        the same key with a different body or under different permissions is a 409.
        AI app connections (MCP connector tokens) may not create `source: calendar` entries.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryCreate"
      responses:
        "200":
          description: Created time entry
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyDomainOrWorkspaceConflict" }

  /api/v2/time_entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Time entry CUID

    patch:
      tags: [Time Entries]
      summary: Update a time entry
      operationId: updateTimeEntry
      description: |
        Update fields on a time entry. `source` is immutable after creation.
        Metadata uses merge semantics — new keys are merged into existing metadata.
        Set metadata to `null` to clear it. Supports `Idempotency-Key` for safe retries.
        Calendar-derived entries are not found for AI app connections.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryUpdate"
      responses:
        "200":
          description: Updated time entry
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyDomainOrWorkspaceConflict" }

    delete:
      tags: [Time Entries]
      summary: Delete a time entry
      operationId: deleteTimeEntry
      description: Cannot delete locked or approved entries. Supports `Idempotency-Key`. Not available to AI app connections.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      responses:
        "204":
          description: Time entry deleted
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyOrDomainConflict" }

  /api/v2/time_entries/{id}/stop:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Time entry CUID

    patch:
      tags: [Time Entries]
      summary: Stop a running timer
      operationId: stopTimeEntryTimer
      description: |
        Stops a running timer using server-side elapsed-time calculation. Empty request bodies are accepted.
        Supports `Idempotency-Key`: a replay returns the stored response for this entry and never
        stops a different timer.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string, description: Optional notes replacement when the entry is editable. }
                stopped_at: { type: string, format: date-time, description: Optional explicit stop instant for offline replay. }
      responses:
        "200":
          description: Stopped time entry
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyDomainOrWorkspaceConflict" }

  /api/v2/time_entries/{id}/restart:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Time entry CUID

    patch:
      tags: [Time Entries]
      summary: Restart a stopped timer
      operationId: restartTimeEntryTimer
      description: |
        Restarts the same time-entry row as a running timer. Pass `replace_running:true` to stop any
        currently running timer first. Supports `Idempotency-Key`. Not available to AI app connections.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                replace_running: { type: boolean, default: false }
      responses:
        "200":
          description: Restarted running time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Conflict, including `running_entry` when another timer is running, or an
            `Idempotency-Key` conflict (`key_reused`, `authorization_changed`, `in_progress`,
            `idempotency_unresolved`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunningTimerConflict"

  /api/v2/time_entries/{id}/adjust_running_timer:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Running time entry CUID

    patch:
      tags: [Time Entries]
      summary: Remove a reviewed inactive period from a running timer
      operationId: adjustRunningTimeEntryTimer
      description: |
        Owner-only atomic correction used after a desktop inactivity review. The
        stop action ends the entry at `inactive_started_at`. The continue action
        also creates a separate running entry at `resumed_at`, leaving an exact
        gap. Keito does not store raw device-activity telemetry.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, inactive_started_at, expected_timer_started_at]
                  properties:
                    action: { type: string, enum: [stop_and_remove] }
                    inactive_started_at: { type: string, format: date-time }
                    expected_timer_started_at: { type: string, format: date-time }
                - type: object
                  additionalProperties: false
                  required: [action, inactive_started_at, resumed_at, expected_timer_started_at]
                  properties:
                    action: { type: string, enum: [continue_and_remove] }
                    inactive_started_at: { type: string, format: date-time }
                    resumed_at: { type: string, format: date-time }
                    expected_timer_started_at: { type: string, format: date-time }
      responses:
        "200":
          description: Adjusted stopped entry and optional continued running entry
          content:
            application/json:
              schema:
                type: object
                required: [time_entry, running_time_entry]
                properties:
                  time_entry: { $ref: "#/components/schemas/TimeEntry" }
                  running_time_entry:
                    allOf:
                      - $ref: "#/components/schemas/TimeEntry"
                    nullable: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyOrDomainConflict" }

  /api/v2/time_entries/{id}/external_reference:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Time entry CUID

    delete:
      tags: [Time Entries]
      summary: Remove a time entry external reference
      operationId: removeTimeEntryExternalReference
      description: Removes all external-reference fields. Locked entries cannot be changed.
      responses:
        "204":
          description: External reference removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v2/approvals/submit:
    post:
      tags: [Timesheet Approvals]
      summary: Submit your own time for approval
      operationId: submitTimesheet
      description: |
        Submits the authenticated person's completed, unsubmitted and unbilled time entries in
        the period, exactly like "Submit for approval" on the Day and Week views, and notifies
        their approvers. There is no `user_id`: submitting on behalf of a teammate is not
        available through the API. Without `fingerprint` the current state is submitted; with
        one, the request fails with `submission_stale` if the period changed since it was taken.
        A running timer in the period returns `running_timer`. Requires the Timesheet approvals
        feature (Pro or Business) switched on for the workspace. Personal read-only sync keys
        cannot call this. Supports `Idempotency-Key`; a 409 releases the key.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalSubmitRequest" }
      responses:
        "200":
          description: Submitted (a period with nothing to submit returns `submitted_count` 0)
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalSubmitResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`running_timer`, `submission_stale` or `submission_conflict`, or an `Idempotency-Key` conflict."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v2/approvals/approve:
    post:
      tags: [Timesheet Approvals]
      summary: Approve a person's submitted time
      operationId: approveTimesheet
      description: |
        Approves every submitted time entry and expense for one person in the period (optionally
        one project), exactly like Approve on Time > Approval. Approved time is locked and its
        week refuses new or changed time (`approved_timesheet_week_locked`) until an approver
        withdraws the approval in Keito.

        Who may approve matches the app: owners and administrators approve anyone in the
        workspace; managers approve the teammates assigned to them and, only with the
        "approve time on projects they manage" permission, time on the projects they manage.
        Members cannot approve. A person outside the caller's reach returns 403; a person or
        project from another workspace returns 404.

        Approval runs the same preflight review as the app. Blockers (for example a running
        timer or unsubmitted time in the period) return `approval_blocked` and cannot be
        acknowledged. Warnings (hours below expected, time outside working capacity,
        overlapping entries) return `approval_warnings_unacknowledged` with the current
        `preflight`; retry with its `fingerprint` as `preflight_fingerprint` and every warning
        code in `acknowledged_warning_codes`. A workspace that sets Hours below expected to
        "Don't warn" in Settings never returns `HOURS_BELOW_EXPECTED`; still listing that code in
        `acknowledged_warning_codes` is accepted. A fingerprint that no longer matches returns
        `approval_preflight_stale` with the fresh preflight. A change made while the approval
        is saved returns `approval_conflict`. Supports `Idempotency-Key`; a 409 releases the key.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalApproveRequest" }
      responses:
        "200":
          description: Approved (nothing submitted in scope returns zero counts)
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalApproveResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Preflight review required or a concurrent change, or an `Idempotency-Key` conflict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalConflict" }

  /api/v2/approvals/reject:
    post:
      tags: [Timesheet Approvals]
      summary: Reject a person's submitted time
      operationId: rejectTimesheet
      description: |
        Returns every submitted time entry and expense for one person in the period (optionally
        one project) to unsubmitted, exactly like Reject on Time > Approval. The person is
        notified with the optional `reason`. The same approver rules as
        `POST /api/v2/approvals/approve` apply. Supports `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalRejectRequest" }
      responses:
        "200":
          description: Rejected (nothing submitted in scope returns zero counts)
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalActionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }

  /api/v2/external_references/summary:
    get:
      tags: [External References]
      summary: Summarize time for an external object
      operationId: summarizeExternalReference
      description: Returns company-wide aggregates without exposing individual time entries or rates. `last_used` is omitted when the caller cannot track time to that project.
      parameters:
        - name: service
          in: query
          required: true
          schema: { type: string }
          example: zendesk.com
        - name: id
          in: query
          required: true
          schema: { type: string }
          example: "12345"
        - name: group_id
          in: query
          schema: { type: string }
        - name: account_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: External-reference time summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalReferenceSummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─── EXPENSES ──────────────────────────────────────────────────
  /api/v2/expenses:
    get:
      tags: [Expenses]
      summary: List expenses
      operationId: listExpenses
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: user_id
          in: query
          description: |
            Optional expense owner filter. Use `me` for the authenticated API-key
            user. When omitted, owners and administrators receive expenses for the
            whole workspace; other members receive only their own expenses.
          schema: { type: string }
        - name: client_id
          in: query
          schema: { type: string }
        - name: project_id
          in: query
          schema: { type: string }
        - name: expense_category_id
          in: query
          schema: { type: string }
          description: Limit results to one expense category in the current workspace.
        - name: approval_status
          in: query
          schema: { type: string, enum: [unsubmitted, submitted, approved] }
          description: Filter by the expense approval state.
        - name: is_billed
          in: query
          schema: { type: boolean }
        - name: invoice_id
          in: query
          schema: { type: string, minLength: 1, maxLength: 191 }
          description: Filter by a Keito invoice CUID linked directly or through a grouped invoice line. Combined with other filters before pagination. Blank, conflicting repeated, or internally whitespace-containing values return 400. Unknown invoices or invoices outside the current workspace return an empty list.
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
        - name: source
          in: query
          schema: { type: string, enum: [web, cli, api, agent] }
      responses:
        "200":
          description: Paginated list of expenses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      expenses:
                        type: array
                        items:
                          $ref: "#/components/schemas/Expense"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/WorkspaceMismatch" }

    post:
      tags: [Expenses]
      summary: Create an expense
      operationId: createExpense
      description: |
        Records bookkeeping data only; no payment is executed. Supports `Idempotency-Key`
        for safe retries. Every expense carries the `currency` its `total_cost` is denominated in.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCreate"
      responses:
        "200":
          description: Created expense
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyDomainOrWorkspaceConflict" }

  /api/v2/expenses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Expense CUID

    get:
      tags: [Expenses]
      summary: Get an expense
      operationId: getExpense
      responses:
        "200":
          description: Expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [Expenses]
      summary: Update an expense
      operationId: updateExpense
      description: |
        Approved, billed or locked expenses cannot be changed. Supports `Idempotency-Key` for
        safe retries. Not available to AI app connections.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated expense
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }

    delete:
      tags: [Expenses]
      summary: Delete an expense
      operationId: deleteExpense
      description: |
        Approved, billed or locked expenses cannot be deleted. Supports `Idempotency-Key`.
        Not available to AI app connections.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      responses:
        "200":
          description: Expense deleted
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }

  /api/v2/expenses/{id}/receipt:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Expense CUID in the authenticated workspace.
    get:
      tags: [Expenses]
      operationId: getExpenseReceipt
      summary: Download an expense receipt
      description: |
        Returns the original file bytes after checking current expense visibility and workspace
        Expenses enablement. The response uses the stored MIME type, an inline filename and
        Cache-Control private, no-store. A missing receipt or stored file returns 404.
        Use a full-access API key with current record access; personal sync keys and AI app
        connections cannot call this route. A receipt URL is an authenticated path, not a public link.
      responses:
        "200":
          description: Original receipt bytes with the stored Content-Type.
          headers:
            Cache-Control:
              schema: { type: string, enum: ["private, no-store"] }
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Expenses]
      operationId: uploadExpenseReceipt
      summary: Upload or replace an expense receipt
      description: |
        Create the expense first, retain its ID, then send multipart/form-data with field file.
        Replaces the existing receipt only after the new file has been stored. The maximum
        upload is 9 MiB (9437184 bytes); empty files are refused. Supported MIME types are PDF,
        JPEG, PNG, GIF, WebP, HEIC, HEIF and TIFF. Expenses must be enabled and the caller must
        currently have access. Approved, billed, locked expenses and locked timesheet weeks
        cannot be changed. Personal sync keys and AI app connections cannot call this route.
        Upload is separate from parsing/OCR and does not change attach_receipt_to_invoice.
        There is no idempotency-key contract on this route; do not recreate the expense when
        retrying an upload. The returned receipt_url remains authenticated.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  x-maxBytes: 9437184
                  description: Non-empty original receipt file, at most 9 MiB.
            encoding:
              file:
                contentType: application/pdf, image/jpeg, image/png, image/gif, image/webp, image/heic, image/heif, image/tiff
      responses:
        "201":
          description: Receipt stored and attached to the expense.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Expenses]
      operationId: deleteExpenseReceipt
      summary: Remove an expense receipt
      description: |
        Clears receipt metadata and removes its stored file. The same current record access,
        feature enablement, approved/billed/locked-expense and timesheet-week protections as
        upload apply. Missing receipt returns 404. Personal sync keys and AI app connections
        cannot call this route. There is no idempotency-key contract for receipt removal.
      responses:
        "200":
          description: Receipt removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v2/expense_categories:
    get:
      tags: [Expenses]
      summary: List expense categories
      operationId: listExpenseCategories
      description: Categories the workspace records expenses against. Requires the expenses feature.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Paginated expense categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      expense_categories:
                        type: array
                        items:
                          $ref: "#/components/schemas/ExpenseCategory"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/WorkspaceMismatch" }

  # ─── PROJECTS ──────────────────────────────────────────────────
  /api/v2/projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      description: Owners/admins see all workspace projects. Other internal users see only actively assigned projects. Rates, fees, budgets, and internal costs are omitted unless the bound user has the matching UX permission.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: is_active
          in: query
          schema: { type: boolean, default: true }
        - name: client_id
          in: query
          schema: { type: string }
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
        - name: owner_id
          in: query
          schema: { type: string }
          description: Eligible workspace member ID, or `unassigned`.
      responses:
        "200":
          description: Paginated list of projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      projects:
                        type: array
                        items:
                          $ref: "#/components/schemas/Project"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/WorkspaceMismatch" }

    post:
      tags: [Projects]
      summary: Create a project
      operationId: createProject
      description: |
        Requires owner/admin access or manager access with canEditProjects permission.

        Pass `template_id` (from `GET /api/v2/project_templates`) to create the project from a
        saved project template. The template supplies billing, budget and visibility settings,
        tasks and people, so the request may only add `name`, `client_id`, `code`, `notes`,
        `owner_id`, `starts_on` and `ends_on`; any billing, budget or task field alongside
        `template_id` is rejected with 400. `client_id` is optional when the template is tied to a
        client and overrides that client when supplied. Shared tasks or people that are no longer
        active in the workspace are skipped; when no task survives, default tasks are assigned.

        Workspace task default rates are stored in the workspace currency. When the client bills
        in another currency, each assigned task's default rate is converted into the client currency
        at the current exchange rate before it is stored, exactly as the web project form does; when
        no rate is known the workspace figure is kept. Servers that do this advertise
        `project-task-rate-currency-conversion` in `X-Keito-Features`.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
            examples:
              defaultTasks:
                value:
                  client_id: cli_abc123
                  name: Agent Implementation
                  code: AGENT
              explicitTasks:
                value:
                  client_id: cli_abc123
                  name: Agent Implementation
                  code: AGENT
                  task_ids: [tsk_development]
              fromTemplate:
                value:
                  template_id: ptpl_onboarding
                  client_id: cli_abc123
                  name: Agent Implementation
      responses:
        "201":
          description: Created project
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyOrDomainConflict" }
        "413": { description: Request body exceeds 131072 bytes. }
        "415": { description: Content-Type must be JSON and Content-Encoding must be identity. }

  /api/v2/project_templates:
    get:
      tags: [Projects]
      summary: List project templates
      operationId: listProjectTemplates
      description: |
        Saved project templates for the workspace, for picking a `template_id` to pass to
        `POST /api/v2/projects`. Requires owner/admin access or manager access with
        canEditProjects permission. Rates, fees and budgets are never returned; the template
        applies them when a project is created.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: Project templates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      project_templates:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProjectTemplate"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v2/projects/archive_review:
    get:
      tags: [Projects]
      summary: Review active projects that may be ready to archive
      operationId: reviewProjectsForArchive
      description: >-
        Lists active projects with no tracked time in the requested inactivity window.
        Owners and admins see the workspace; managers with Edit projects see only
        projects they actively manage. The result is paginated and includes warning
        reasons for uninvoiced work, running timers, retainers, recurring invoices
        and future schedules. Review does not change projects.
      parameters:
        - name: inactive_days
          in: query
          schema: { type: integer, minimum: 1, maximum: 3650, default: 365 }
        - name: started_before
          in: query
          schema: { type: string, format: date }
        - name: imported_only
          in: query
          schema: { type: boolean, default: false }
        - name: client_id
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
        - name: readiness
          in: query
          schema: { type: string, enum: [all, ready, needs_review], default: all }
        - $ref: "#/components/parameters/page"
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200": { description: "Paginated archive candidates, warning reasons, review timestamp and total counts." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v2/projects/archive_review/preflight:
    post:
      tags: [Projects]
      summary: Recheck selected projects before archive
      operationId: preflightProjectArchive
      description: >-
        Rechecks up to 100 exact project IDs against the review criteria and
        timestamp. Returns per-project status, warning reasons and a signed token
        only if every project is eligible. The token is bound to the user,
        workspace, IDs and warning reasons and expires within 30 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_ids, criteria, reviewed_at]
              properties:
                project_ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string } }
                criteria:
                  type: object
                  required: [inactive_days, imported_only]
                  properties:
                    inactive_days: { type: integer, minimum: 1, maximum: 3650 }
                    started_before: { type: string, format: date }
                    imported_only: { type: boolean }
                reviewed_at: { type: string, format: date-time }
      responses:
        "200": { description: "Exact selection statuses, warnings and optional review token." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "412": { description: Review timestamp is stale or in the future. }

  /api/v2/projects/archive_review/archive:
    post:
      tags: [Projects]
      summary: Archive explicitly confirmed projects
      operationId: archiveReviewedProjects
      description: >-
        Archives only IDs matching the signed preflight token, after explicit
        confirmation and warning acknowledgement. Rechecks tenant, manager scope,
        activity and warnings before changing each project. Reports per-ID
        outcomes; preserves project history and may stop running timers.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_token, confirm_project_ids, confirm_archive]
              properties:
                review_token: { type: string }
                confirm_project_ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string } }
                confirm_archive: { type: boolean, enum: [true] }
                acknowledge_warnings: { type: boolean, default: false }
      responses:
        "200": { description: "Archived, blocked and failed counts with per-project outcomes." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/IdempotencyOrDomainConflict" }
        "412": { description: "Invalid or changed review, selection or warning state." }
        "428": { description: Warning acknowledgement is required. }

  /api/v2/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Projects]
      summary: Get a visible project
      operationId: getProject
      description: Uses the same assignment visibility and financial-field redaction as the Keito project page. Invisible and cross-workspace IDs return 404.
      responses:
        "200":
          description: Project details
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Projects]
      summary: Update, archive, or restore a project
      operationId: updateProject
      description: Owners/admins may update any project. Managers require canEditProjects and current project-manager status. Commercial fields also require billable-rate permission. Pass is_active to archive or restore.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: Updated project
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyOrDomainConflict" }
        "412": { description: If-Match does not match the current project version. }
        "413": { description: Request body exceeds 131072 bytes. }
        "415": { description: Content-Type must be JSON and Content-Encoding must be identity. }
    delete:
      tags: [Projects]
      summary: Permanently delete an archived project
      operationId: deleteProject
      description: Owner/admin only. The project must already be archived and If-Match must contain its current ETag. Historical invoice lines are preserved.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      responses:
        "200": { description: Project deleted and invoice history preserved. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyOrDomainConflict" }
        "412": { description: If-Match does not match the current project version. }
        "428": { description: If-Match is required. }

  # ─── PROJECT ASSIGNMENTS ───────────────────────────────────────
  /api/v2/projects/{projectId}/user_assignments:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Project Assignments]
      summary: List the people assigned to a project
      operationId: listProjectUserAssignments
      description: |
        Harvest-compatible project team list. Readable by owners/admins and by people
        assigned to the project; invisible and cross-workspace projects return 404.
        `use_default_rates`, `hourly_rate` and `budget` are returned only to callers
        with billable-rate visibility (owners/admins, or managers with the
        billable-rates permission) and are omitted otherwise. Email addresses and
        cached totals are never returned. Full-access credentials only.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Paginated project team
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      user_assignments:
                        type: array
                        items: { $ref: "#/components/schemas/ProjectUserAssignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Project Assignments]
      summary: Add a person to a project
      operationId: createProjectUserAssignment
      description: |
        Uses the same rules as adding a person in the project editor. Requires an
        owner/admin, or a manager with project-edit permission who currently manages
        the project. Managers may add ordinary people only: project-manager status,
        financial visibility, turning off time tracking and person budgets are
        administrator-only, and client members can only be added by administrators.
        `budget` also requires billable-rate visibility. Adding a previously removed
        person restores their assignment; an active assignment returns 409. Project
        rates are managed in the project editor and are not writable here.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUserAssignmentCreate" }
      responses:
        "201":
          description: Person added or restored
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectUserAssignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyOrDomainConflict" }

  /api/v2/projects/{projectId}/user_assignments/{id}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Project Assignments]
      summary: Get one project user assignment
      operationId: getProjectUserAssignment
      description: Same visibility and field redaction as the list. IDs on another project or workspace return 404.
      responses:
        "200":
          description: Project user assignment
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectUserAssignment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Project Assignments]
      summary: Update or restore a project user assignment
      operationId: updateProjectUserAssignment
      description: |
        Same rules as the project member permissions table. Managers who manage the
        project may only restore or remove ordinary people (`is_active`), or change
        `is_project_manager` for teammates when the workspace allows project managers
        to assign managers; they cannot change their own assignment or another
        project manager's. Everything else is administrator-only, and `budget` also
        requires billable-rate visibility. Pass the ETag in If-Match to avoid
        overwriting a concurrent change.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUserAssignmentUpdate" }
      responses:
        "200":
          description: Updated project user assignment
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectUserAssignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyOrDomainConflict" }
        "412": { description: If-Match does not match the current assignment version. }
    delete:
      tags: [Project Assignments]
      summary: Remove a person from a project
      operationId: deleteProjectUserAssignment
      description: |
        Deactivates the assignment exactly like Remove in the project editor. The
        assignment is never hard-deleted, so logged time and history are kept and the
        person can be restored with PATCH `is_active: true`. Returns the deactivated
        assignment.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      responses:
        "200":
          description: Deactivated project user assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectUserAssignment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyOrDomainConflict" }
        "412": { description: If-Match does not match the current assignment version. }

  /api/v2/projects/{projectId}/task_assignments:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Project Assignments]
      summary: List a project's task assignments
      operationId: listProjectTaskAssignments
      description: |
        Per-project task settings, including task budgets. Readable by owners/admins
        and people assigned to the project. `billable` and `hourly_rate` follow the
        project-financials visibility rule; `budget` follows the project-budget rule
        (which includes "show budget to everyone" for assigned people). Omitted
        otherwise. Full-access credentials only.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Paginated task assignments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      task_assignments:
                        type: array
                        items: { $ref: "#/components/schemas/ProjectTaskAssignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Project Assignments]
      summary: Assign a workspace task to a project
      operationId: createProjectTaskAssignment
      description: |
        Adds an existing, active workspace task (see `GET /api/v2/tasks`) to the
        project, or restores an archived assignment. Requires an owner/admin, or a
        manager with project-edit permission who currently manages the project.
        `billable`, `hourly_rate` and `budget` also require billable-rate visibility.
        An already-active assignment returns 409. Use `POST /api/v2/tasks` to create
        a task that exists only on this project.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectTaskAssignmentCreate" }
      responses:
        "201":
          description: Task assigned or restored
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectTaskAssignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyOrDomainConflict" }

  /api/v2/projects/{projectId}/task_assignments/{id}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [Project Assignments]
      summary: Get one project task assignment
      operationId: getProjectTaskAssignment
      description: Same visibility and field redaction as the list. IDs on another project or workspace return 404.
      responses:
        "200":
          description: Project task assignment
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectTaskAssignment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Project Assignments]
      summary: Update a task's budget, rate, billability, or active state on a project
      operationId: updateProjectTaskAssignment
      description: |
        Requires an owner/admin, or a manager with project-edit permission who
        currently manages the project. `billable`, `hourly_rate` and `budget` also
        require billable-rate visibility; send `null` to clear a rate or budget. A
        new `hourly_rate` applies to time tracked from now on; existing time entries
        are not repriced. `is_active: false` archives the task on this project
        without deleting anything; `true` restores it.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectTaskAssignmentUpdate" }
      responses:
        "200":
          description: Updated task assignment
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectTaskAssignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyOrDomainConflict" }
        "412": { description: If-Match does not match the current assignment version. }
    delete:
      tags: [Project Assignments]
      summary: Remove a task from a project
      operationId: deleteProjectTaskAssignment
      description: |
        Same as Remove in the project editor. If any time was logged against the
        task on this project the assignment is archived (`outcome: archived`) and can
        be restored with PATCH `is_active: true`; only an assignment nothing was
        logged against is deleted (`outcome: deleted`), along with its task when the
        task existed only on this project.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      responses:
        "200":
          description: Task removed from the project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectTaskAssignmentRemoval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyOrDomainConflict" }
        "412": { description: If-Match does not match the current assignment version. }

  # ─── CLIENTS ───────────────────────────────────────────────────
  /api/v2/clients:
    get:
      tags: [Clients]
      summary: List clients
      description: >-
        Returns full client records (billing address, tax and discount terms,
        payment terms). Requires an owner or administrator, or a manager with
        the client management grant or an invoicing grant; other users receive
        403.

        Pass `fields=minimal` for the roster a project picker needs —
        `id`, `name`, `currency` and `is_active` only. That shape is also
        available to a manager who may create projects (`canEditProjects`)
        but holds no client or invoicing grant; anyone else receives 403
        `Client lookup requires project, client management, or invoicing
        permissions`. Any other `fields` value is refused with 400. Servers
        that support it advertise `clients-minimal-fields` in
        `X-Keito-Features`.
      operationId: listClients
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: fields
          in: query
          schema: { type: string, enum: [minimal] }
          description: Return only `id`, `name`, `currency` and `is_active` per client.
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Paginated list of clients
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      clients:
                        type: array
                        items:
                          oneOf:
                            - $ref: "#/components/schemas/Client"
                            - $ref: "#/components/schemas/ClientMinimal"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/WorkspaceMismatch" }

    post:
      tags: [Clients]
      summary: Create a client
      operationId: createClient
      description: Requires owner/admin access or manager access with canEditClientsAndTasks.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreate"
      responses:
        "201":
          description: Created client
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: Request body exceeds 131072 bytes. }
        "415": { description: Content-Type must be JSON and Content-Encoding must be identity. }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }

  /api/v2/clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }

    get:
      tags: [Clients]
      summary: Get a client
      description: >-
        Returns the full client record including contacts. Requires an owner or
        administrator, or a manager with the client management grant or an
        invoicing grant; other users receive 403.
      operationId: getClient
      responses:
        "200":
          description: Client details
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [Clients]
      summary: Update a client
      operationId: updateClient
      description: Requires owner/admin access or manager access with canEditClientsAndTasks. Only owners/admins may change is_active.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { description: If-Match does not match the current client version. }
        "413": { description: Request body exceeds 131072 bytes. }
        "415": { description: Content-Type must be JSON and Content-Encoding must be identity. }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
    delete:
      tags: [Clients]
      summary: Permanently delete an archived client
      operationId: deleteClient
      description: Owner/admin only. The client must be archived, have no projects or financial documents, and have a current If-Match value.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      responses:
        "200": { description: Client deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyOrDomainConflict" }
        "412": { description: If-Match does not match the current client version. }
        "428": { description: If-Match is required. }

  # ─── CONTACTS ──────────────────────────────────────────────────
  /api/v2/contacts:
    get:
      tags: [Contacts]
      summary: List contacts
      description: >-
        Contacts are client personal data. Requires an owner or administrator,
        or a manager with the client management grant or an invoicing grant;
        other users receive 403.
      operationId: listContacts
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: client_id
          in: query
          schema: { type: string }
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Paginated list of contacts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      contacts:
                        type: array
                        items:
                          $ref: "#/components/schemas/Contact"
        "401": { $ref: "#/components/responses/Unauthorized" }

    post:
      tags: [Contacts]
      summary: Create a contact
      operationId: createContact
      description: >-
        Requires manager or admin permissions. The body is accepted with or
        without a JSON `Content-Type`. An `Idempotency-Key` makes retries safe
        for 24 hours; invalid bodies and unknown clients never consume it.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreate"
      responses:
        "200":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrCapabilityRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }

  # ─── TASKS ─────────────────────────────────────────────────────
  /api/v2/tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      operationId: listTasks
      description: |
        Pass `project_id` to return tasks assigned to that project. Authorized
        callers also receive the authenticated user's current
        `effective_billable_rate` and the project billing currency for each task.
        Callers who can view the project budget also receive the active task
        assignment's `budget`, including `null` when that assignment has no budget.
        Requests without `project_id` omit `budget` because workspace-global tasks
        do not have a single project budget. Unauthorized callers receive the same
        task list with protected rate and budget properties omitted.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: project_id
          in: query
          schema: { type: string }
          description: Return tasks assigned to this project and resolve project/task tracking rates.
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Paginated list of tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      tasks:
                        type: array
                        items:
                          $ref: "#/components/schemas/Task"
              examples:
                authorizedTrackingOptions:
                  summary: Project-authorized caller
                  value:
                    tasks:
                      - id: task_development
                        name: Development
                        billable_by_default: true
                        effective_billable_rate: 150
                        currency: GBP
                        budget: 40
                        is_default: true
                        is_active: true
                        parent_task_id: null
                    page: 1
                    per_page: 100
                    total_pages: 1
                    total_entries: 1
                ordinaryAssignee:
                  summary: Caller without billable-rate visibility
                  value:
                    tasks:
                      - id: task_development
                        name: Development
                        billable_by_default: true
                        is_default: true
                        is_active: true
                        parent_task_id: null
                    page: 1
                    per_page: 100
                    total_pages: 1
                    total_entries: 1
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/WorkspaceMismatch" }

    post:
      tags: [Tasks]
      summary: Create a project-scoped task
      operationId: createProjectTask
      description: |
        Creates an active task usable only on `project_id` and assigns it to that
        project. Requires a full-access credential and an internal workspace
        administrator or a manager with project-edit permission who manages the
        selected project. A manager also needs billable-rate visibility to set
        `billable`, `hourly_rate`, or `budget`. Omitted `billable` inherits the
        project's billable setting. Reusing the name of an active task on the
        project returns 409; an archived assignment with that name is restored.
        Supports Idempotency-Key for safe retries.
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectTaskCreate" }
      responses:
        "201":
          description: Project task and assignment created or restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectTaskCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyOrDomainConflict" }

  # ─── USERS ─────────────────────────────────────────────────────
  /api/v2/roles:
    get:
      tags: [Roles]
      summary: List custom reporting roles
      operationId: listRoles
      description: |
        Returns active custom reporting-role assignments for the authenticated
        workspace, newest role first. Requires owner/administrator access and a
        full-access key or the `users:read` cost-rate automation scope. Personal
        read-only sync keys are not permitted.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
      responses:
        "200":
          description: Paginated reporting roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      roles:
                        type: array
                        items: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v2/users:
    get:
      tags: [Users]
      summary: List workspace users for administrator automation
      operationId: listUsers
      description: |
        Full-access and cost-rate automation keys receive a Harvest-compatible,
        workspace-scoped directory for team and payroll integrations and require
        owner/administrator access. `roles` contains descriptive custom reporting
        roles; `access_roles` contains permission roles. Imported placeholders use
        their recoverable original address, while contact-erased members remain
        redacted. Cost and billable rates are never included.

        Personal read-only sync keys receive the separate reduced directory shape.
        It is limited to active internal human identities, omits email, capacity,
        custom roles and relationships, and keeps the existing permission values in
        its `roles` property for compatibility.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: employee_id
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Paginated workspace user directory
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/PaginationEnvelope"
                      - type: object
                        properties:
                          users:
                            type: array
                            items: { $ref: "#/components/schemas/WorkspaceUser" }
                  - allOf:
                      - $ref: "#/components/schemas/PaginationEnvelope"
                      - type: object
                        properties:
                          users:
                            type: array
